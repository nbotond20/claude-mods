<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Usage</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f5f5f2; --panel: #ffffff; --panel2: #fafaf8; --ink: #1c1c1a; --muted: #6d6c66; --faint: #9a9993; --line: #e6e5df; --line2: #efeee9;
  --accent: #c96442; --accent-ink: #ffffff; --good: #2f7d4f; --warn: #b7791f; --bad: #b83a3a; --hover: #f1f0eb; --bar: rgba(201, 100, 66, .13);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03); --shadow-lg: 0 18px 50px rgba(0,0,0,.18);
  --s1: #c96442; --s2: #3d6fb6; --s3: #2f7d4f; --s4: #8a5cb8; --s5: #b7791f; --s6: #4a9fa8; --s7: #b8457a; --s8: #7a7a70;
  --s9: #5f8f2f; --s10: #c2a23a; --s11: #4a5fa8; --s12: #a8634a;
  --side: 224px; --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141413; --panel: #1d1d1b; --panel2: #191917; --ink: #ecebe6; --muted: #a3a29b; --faint: #75746e; --line: #302f2b; --line2: #262523;
  --accent: #e08a68; --accent-ink: #1a1a18; --good: #5bb07f; --warn: #d9a54a; --bad: #e06b6b; --hover: #262624; --bar: rgba(224, 138, 104, .16);
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
  --s1: #e08a68; --s2: #6f9be0; --s3: #5bb07f; --s4: #b08ae0; --s5: #d9a54a; --s6: #6cc3cc; --s7: #e07aa8; --s8: #a8a89e; --s9: #9ccc65; --s10: #e6cf6a; --s11: #8f9cf0; --s12: #d49a80;
} }
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --panel2: #191917; --ink: #ecebe6; --muted: #a3a29b; --faint: #75746e; --line: #302f2b; --line2: #262523;
  --accent: #e08a68; --accent-ink: #1a1a18; --good: #5bb07f; --warn: #d9a54a; --bad: #e06b6b; --hover: #262624; --bar: rgba(224, 138, 104, .16);
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
  --s1: #e08a68; --s2: #6f9be0; --s3: #5bb07f; --s4: #b08ae0; --s5: #d9a54a; --s6: #6cc3cc; --s7: #e07aa8; --s8: #a8a89e; --s9: #9ccc65; --s10: #e6cf6a; --s11: #8f9cf0; --s12: #d49a80;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing: antialiased; }
body.noscroll { overflow: hidden; }
a { color: var(--accent); }
select, input, button, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -1px; }
button { cursor: pointer; transition: background .15s, border-color .15s; }
button:hover { background: var(--hover); }
button:disabled { opacity: .55; cursor: default; }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--panel2); }
code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
aside { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--panel2); display: flex; flex-direction: column; padding: 14px 10px; gap: 6px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 10px; font-weight: 650; font-size: 15px; }
.brand .logo { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.brand span { color: var(--accent); }
.search { display: flex; align-items: center; justify-content: space-between; color: var(--muted); border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 9px; cursor: pointer; margin: 0 2px 6px; font-size: 12.5px; }
.search:hover { border-color: var(--faint); }
nav { flex: 1; overflow: auto; }
nav .group { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); padding: 12px 10px 4px; font-weight: 600; }
nav a { display: flex; align-items: center; gap: 9px; padding: 6px 10px; margin: 1px 0; border-radius: 7px; cursor: pointer; color: var(--muted); text-decoration: none; user-select: none; transition: background .12s, color .12s; }
nav a svg { width: 15px; height: 15px; flex: none; opacity: .85; }
nav a:hover { background: var(--hover); color: var(--ink); }
nav a.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), var(--shadow); font-weight: 550; }
nav a.on svg { color: var(--accent); opacity: 1; }
nav a .badge { margin-left: auto; font-size: 10px; color: var(--accent); }
.sidefoot { border-top: 1px solid var(--line); padding: 10px 8px 0; display: grid; gap: 8px; font-size: 12px; color: var(--muted); }
.live { display: flex; align-items: center; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.live.on .dot { background: var(--good); box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); animation: breathe 2.4s infinite; }
.live.flash .dot { animation: ping .9s ease-out; }
.live.off .dot { background: var(--bad); }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); } 50% { box-shadow: 0 0 0 4px transparent; } }
@keyframes ping { 0% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 70%, transparent); } 60% { transform: scale(1.35); box-shadow: 0 0 0 8px transparent; } 100% { transform: scale(1); } }
.sidefoot .row2 { display: flex; gap: 6px; }
.sidefoot button { flex: 1; font-size: 12px; padding: 4px 6px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); padding: 10px 22px; }
.titlerow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.titlerow h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.titlerow .sub { color: var(--muted); font-size: 12.5px; }
.status { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: 9px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 10px; border-radius: 6px; color: var(--muted); font-size: 12.5px; }
.seg button.on { background: var(--ink); color: var(--bg); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; user-select: none; color: var(--muted); font-size: 12.5px; transition: all .12s; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.chip.on { color: var(--ink); border-color: var(--ink); }
.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; cursor: pointer; user-select: none; }
.filters .grow { flex: 1; }
.filters select, .filters input { font-size: 12.5px; padding: 4px 8px; }
.filters .btn { font-size: 12.5px; padding: 4px 10px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.content { padding: 18px 22px 70px; max-width: 1640px; width: 100%; }
.tabnote { color: var(--muted); margin: 0 0 14px; max-width: 980px; }

/* ---------- KPI cards ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 13px 9px; box-shadow: var(--shadow); overflow: hidden; min-height: 92px; }
.kpi small { color: var(--muted); font-size: 11.5px; display: block; }
.kpi b { display: block; font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 2px 0 1px; transition: color .4s; }
.kpi b.bump { color: var(--accent); }
.kpi .delta { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--muted); }
.kpi .delta.up.bad, .kpi .delta.down.bad { color: var(--bad); }
.kpi .delta.up.good, .kpi .delta.down.good { color: var(--good); }
.kpi svg.spark { position: absolute; right: 12px; top: 14px; width: 64px; height: 24px; opacity: .9; }
.kpi.hero svg.spark { width: 150px; height: 40px; top: 18px; }
.kpi.hero { grid-column: span 2; }
.kpi.hero small { max-width: calc(100% - 160px); }
.kpi.hero b { font-size: 28px; }
.meter { height: 5px; background: var(--line2); border-radius: 9px; overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 9px; transition: width .5s; }

/* ---------- panels ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)); gap: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 14px 12px; min-width: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.panel.wide { grid-column: 1 / -1; }
.panel > header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.panel > header > div:first-child { flex: 1; min-width: 0; }
.panel h3 { margin: 0; font-size: 13.5px; font-weight: 620; }
.panel p.note { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.acts { display: flex; gap: 3px; align-items: center; opacity: .55; transition: opacity .15s; }
.panel:hover .acts, .panel.max .acts { opacity: 1; }
.acts button { border: 0; background: transparent; padding: 3px 5px; color: var(--muted); border-radius: 5px; display: grid; place-items: center; }
.acts button:hover { background: var(--hover); color: var(--ink); }
.acts button svg { width: 14px; height: 14px; }
.acts input { width: 120px; font-size: 12px; padding: 2px 7px; }
.panel.max { position: fixed; inset: 18px; z-index: 30; box-shadow: var(--shadow-lg); overflow: auto; }
.panel.max .chart { height: calc(100vh - 120px) !important; }
.panel.max .tbl { max-height: calc(100vh - 110px); }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 25; display: none; }
.scrim.on { display: block; }
.chart { position: relative; height: 280px; }
.chart.tall { height: 400px; }
.chart.short { height: 200px; }
.tbl { overflow: auto; max-height: 470px; border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 5px 9px; border-bottom: 1px solid var(--line2); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; z-index: 1; background: var(--panel); cursor: pointer; color: var(--muted); font-weight: 600; font-size: 11.5px; border-bottom: 1px solid var(--line); user-select: none; }
th:hover { color: var(--ink); }
th.num { text-align: right; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.long { white-space: normal; min-width: 260px; max-width: 560px; }
td a { cursor: pointer; text-decoration: none; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
tbody tr { transition: background .1s; }
tbody tr:hover td { background: var(--hover); }
tr.new td { animation: flash 2.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
.more { color: var(--muted); font-size: 12px; padding: 6px 2px 0; }
.gauge { display: inline-flex; align-items: center; gap: 7px; }
.gauge .meter { width: 70px; margin: 0; }
.gauge .meter > i.hot { background: var(--bad); }
.gauge .meter > i.warm { background: var(--warn); }
.pill { display: inline-block; padding: 0 7px; border-radius: 99px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
.pill.err { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 8px; margin-bottom: 16px; }
.insight { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 9px 13px; box-shadow: var(--shadow); }
.insight.good { border-left-color: var(--good); }
.insight.warn { border-left-color: var(--warn); }
.insight.bad { border-left-color: var(--bad); }
.empty { color: var(--muted); padding: 26px; text-align: center; }
.err { color: var(--bad); }
.skel { height: 240px; border-radius: 8px; background: linear-gradient(90deg, var(--line2) 0%, var(--hover) 40%, var(--line2) 80%); background-size: 300% 100%; animation: shimmer 1.3s infinite linear; }
.skel.s { height: 60px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.heat { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 2px; font-size: 10px; color: var(--muted); }
.heat div { height: 22px; border-radius: 3px; display: flex; align-items: center; justify-content: center; }
h2.sec { margin: 22px 0 8px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; }
h2.sec small { color: var(--muted); font-weight: normal; font-size: 12px; }
.banner { display: none; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 7px 12px; margin-bottom: 12px; font-size: 12.5px; }
.banner.on { display: flex; }

/* ---------- drawer, palette, toast ---------- */
.drawer { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer.open { opacity: 1; pointer-events: auto; }
.drawer > div { position: absolute; right: 0; top: 0; bottom: 0; width: min(1120px, 100%); background: var(--bg); overflow: auto; padding: 18px 22px; transform: translateX(30px); transition: transform .22s ease-out; box-shadow: var(--shadow-lg); }
.drawer.open > div { transform: none; }
.drawer .dhead { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
.drawer .dhead h3 { margin: 0; font-size: 16px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
.palette { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.3); display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.palette.open { display: flex; }
.palette > div { width: min(560px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 13px 16px; font-size: 15px; background: transparent; outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.palette li { padding: 7px 10px; border-radius: 7px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.palette li small { color: var(--faint); }
.palette li.on { background: var(--hover); }
.palette .foot { border-top: 1px solid var(--line); padding: 7px 14px; color: var(--faint); font-size: 11.5px; display: flex; gap: 14px; }
.toast { position: fixed; bottom: 18px; right: 18px; z-index: 60; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; box-shadow: var(--shadow-lg); font-size: 12.5px; opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
.sql textarea { width: 100%; min-height: 130px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.fade { animation: fadein .25s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .kpi.hero svg.spark { width: 64px; height: 24px; top: 14px; }
  .kpi.hero small { max-width: none; }
  .kpi { min-height: 0; }
  .kpi.hero b { font-size: 22px; }
  .kpi svg.spark { opacity: .5; }
  .status { flex-basis: 100%; }
  .acts input { width: 80px; }
  aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 0 6px 0 0; }
  .search { display: none; }
  nav { order: 3; flex-basis: 100%; display: flex; gap: 2px; overflow-x: auto; }
  nav .group { display: none; }
  nav a { white-space: nowrap; }
  .sidefoot { border: 0; padding: 0; margin-left: auto; grid-auto-flow: column; }
  .sidefoot .row2 { display: none; }
  .topbar { position: static; padding: 10px 16px; }
  .content { padding: 14px 16px 60px; }
  .kpi.hero { grid-column: span 1; }
  .status { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">C</div><div>Claude <span>Usage</span></div></div>
    <div class="search" id="openPalette"><span>Search, jump, act…</span><kbd>⌘K</kbd></div>
    <nav id="tabs"></nav>
    <div class="sidefoot">
      <div class="live" id="live" title="Pushed by the server when new requests, prompts or tool calls are ingested"><span class="dot"></span><span id="liveText">connecting…</span></div>
      <div class="row2"><button id="theme" title="Theme (t)">Theme</button><button id="ingest" title="Fold new transcript and mod data into the database now">Ingest</button></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="titlerow"><h1 id="title">Overview</h1><span class="sub" id="subtitle"></span><span class="status" id="status"></span></div>
      <div class="filters">
        <div class="seg" id="period"></div>
        <div class="chips" id="profiles" title="Profiles (none selected = all)"></div>
        <select id="model" title="Model"><option value="">All models</option></select>
        <input id="project" placeholder="Project contains…  (/)" size="18">
        <label class="toggle" title="Show change against the previous period of the same length"><input type="checkbox" id="compare" checked> vs previous</label>
        <span class="grow"></span>
        <button class="btn" id="refresh" title="Refresh (r)">Refresh</button>
      </div>
    </div>
    <div class="content">
      <div class="banner" id="banner"><span id="bannerText">New data is in.</span><button class="btn" id="bannerBtn">Update this view</button></div>
      <div class="kpis" id="kpis"></div>
      <div id="view"></div>
    </div>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"><div id="drawerBody"></div></div>
<div class="palette" id="palette"><div><input id="palInput" placeholder="Go to a tab, change the period, run an action…" autocomplete="off"><ul id="palList"></ul>
  <div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> run</span><span><kbd>esc</kbd> close</span><span><kbd>[</kbd><kbd>]</kbd> prev/next tab</span><span><kbd>r</kbd> refresh</span></div></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s)
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const PALETTE = () => Array.from({ length: 12 }, (_, i) => css('--s' + (i + 1)))
const store = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v } catch { return d } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } }
const state = { tab: store.get('cu-tab', 'overview'), days: store.get('cu-days', '30'), profiles: new Set(), meta: null, panels: [], seq: 0, compare: store.get('cu-compare', '1') === '1', stale: false, lastUpdate: null }
if (location.hash.length > 1) state.tab = location.hash.slice(1)

// ---------- formatting ----------
const usd = v => v == null ? '–' : (v < 0 ? '−' : '') + '$' + (Math.abs(v) >= 1000 ? Math.round(Math.abs(v)).toLocaleString() : Math.abs(+v).toFixed(2))
const usdAxis = v => Math.abs(v) >= 10 ? (v < 0 ? '−' : '') + '$' + Math.round(Math.abs(v)).toLocaleString() : usd(v)
const big = v => { if (v == null) return '–'; const a = Math.abs(v)
  return a >= 1e9 ? (v/1e9).toFixed(2)+'B' : a >= 1e6 ? (v/1e6).toFixed(1)+'M' : a >= 1e4 ? Math.round(v/1e3)+'k' : a >= 1e3 ? (v/1e3).toFixed(1)+'k' : String(Math.round(v*100)/100) }
const pct = v => v == null ? '–' : (+v).toFixed(1) + '%'
const fmtCell = (col, v) => {
  if (v == null) return ''
  if (typeof v !== 'number') return String(v)
  if (/cost|saved|spent|usd/.test(col)) return usd(v)
  if (/pct|share/.test(col)) return pct(v)
  if (/^(hour|weekday|spawn_depth|is_error|deferred)$/.test(col)) return String(v)
  return big(v)
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x }
const ago = ts => { if (!ts) return '–'; const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000)
  return s < 60 ? Math.round(s) + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? (s / 3600).toFixed(1) + 'h ago' : Math.round(s / 86400) + 'd ago' }

// ---------- data ----------
function params(extra = {}) {
  const p = new URLSearchParams({ days: state.days })
  if (state.profiles.size) p.set('profile', [...state.profiles].join(','))
  if ($('#model').value) p.set('model', $('#model').value)
  if ($('#project').value.trim()) p.set('project', $('#project').value.trim())
  for (const [k, v] of Object.entries(extra)) p.set(k, v)
  return p
}
async function api(path, extra) {
  const r = await fetch(path + (path.includes('?') ? '&' : '?') + params(extra))
  const j = await r.json()
  if (!r.ok) throw new Error(j.error || r.status)
  return j
}
const asObjs = d => d.rows.map(r => Object.fromEntries(d.cols.map((c, i) => [c, r[i]])))
/** The period before the current one, same length (null for all time). */
function prevRange() {
  const n = +state.days
  if (!n) return null
  // No comparison when the data does not cover the whole previous period (it would read as a huge jump).
  const today = new Date(), curFrom = addDays(today, -(n - 1)), to = addDays(curFrom, -1)
  const from = ymd(addDays(to, -(n - 1)))
  if (state.meta && state.meta.range[0] > from) return null
  return { from, to: ymd(to) }
}

const colorIdx = new Map()
function colorFor(label) {
  if (!colorIdx.has(label)) colorIdx.set(label, colorIdx.size % 12)
  return PALETTE()[colorIdx.get(label)]
}

Chart.defaults.font.family = getComputedStyle(document.body).fontFamily
Chart.defaults.font.size = 11

/** Long rows (x, series, y) -> one dataset per series. */
function pivot(objs, x, s, y) {
  const xs = [...new Set(objs.map(o => o[x]))]
  const totals = {}
  objs.forEach(o => totals[o[s]] = (totals[o[s]] || 0) + (o[y] || 0))
  const ss = Object.keys(totals).sort((a, b) => totals[b] - totals[a])
  const idx = Object.fromEntries(xs.map((v, i) => [v, i]))
  const data = Object.fromEntries(ss.map(k => [k, xs.map(() => 0)]))
  objs.forEach(o => data[o[s]][idx[o[x]]] += o[y] || 0)
  return { labels: xs, series: ss.map(k => ({ label: k, data: data[k] })) }
}

function chartConfig(p, d) {
  const objs = asObjs(d)
  const grid = css('--line2'), tick = css('--muted')
  const fmtY = p.money ? usd : p.pct ? pct : big
  if (p.kind === 'scatter') {
    const groups = {}
    objs.forEach(o => (groups[o[p.series]] ??= []).push({ x: o[p.x], y: o[p.y], o }))
    const datasets = Object.entries(groups).map(([k, pts]) => { const c = colorFor(k); return { label: k, data: pts, backgroundColor: c + '99', borderColor: c, pointRadius: 3.5, pointHoverRadius: 6 } })
    return { type: 'scatter', data: { datasets }, options: {
      responsive: true, maintainAspectRatio: false,
      onClick: (ev, els) => { const e = els[0]; if (e) { const o = datasets[e.datasetIndex].data[e.index].o; if (o.session_id) openSession(o.session_id) } },
      plugins: { legend: { position: 'bottom', labels: { color: tick, boxWidth: 9, usePointStyle: true } },
        tooltip: { callbacks: { label: c => { const o = c.raw.o; return `${o.project || ''} · ${usd(o.cost)} · peak ${big(o.max_context)} ctx · ${o.requests} req` } } } },
      scales: { x: { type: p.logX ? 'logarithmic' : 'linear', title: { display: true, text: p.xLabel || p.x, color: tick }, grid: { color: grid }, ticks: { color: tick, callback: v => big(v) } },
                y: { type: p.logY ? 'logarithmic' : 'linear', title: { display: true, text: p.yLabel || p.y, color: tick }, grid: { color: grid }, ticks: { color: tick, callback: v => usdAxis(v) } } } } }
  }
  let labels, datasets
  if (p.series) {
    const pv = pivot(objs, p.x, p.series, p.y)
    labels = pv.labels
    datasets = pv.series.slice(0, p.maxSeries || 10).map(s => ({ label: s.label, data: s.data }))
  } else {
    labels = objs.map(o => o[p.x])
    datasets = (Array.isArray(p.y) ? p.y : [p.y]).map(y => ({ label: y, data: objs.map(o => o[y]), yAxisID: p.y2 && p.y2.includes(y) ? 'y2' : 'y' }))
  }
  if (p.labelFmt) labels = labels.map(p.labelFmt)
  const type = p.kind === 'stacked' || p.kind === 'hbar' ? 'bar' : p.kind === 'area' ? 'line' : p.kind
  const single = datasets.length === 1 && !p.series && type !== 'doughnut'
  datasets.forEach(ds => {
    const c = single ? css('--accent') : colorFor(ds.label)
    if (type === 'doughnut') Object.assign(ds, { backgroundColor: labels.map(l => colorFor(l)), borderColor: css('--panel'), borderWidth: 2, hoverOffset: 6 })
    else Object.assign(ds, { backgroundColor: p.kind === 'area' ? c + '44' : type === 'bar' ? c + 'd9' : c, borderColor: c, borderWidth: type === 'line' ? 2 : 0,
      borderRadius: type === 'bar' ? (p.kind === 'stacked' ? 2 : 4) : 0, pointRadius: 0, pointHoverRadius: 4, tension: .3, fill: p.kind === 'area', spanGaps: true, maxBarThickness: 46 })
  })
  const stacked = p.kind === 'stacked' || p.kind === 'area'
  // Paths keep their tail (the project name), everything else its head.
  const trunc = (s, n) => { s = String(s); return s.length <= n ? s : /^[~\/]/.test(s) ? '…' + s.slice(-(n - 1)) : s.slice(0, n - 1) + '…' }
  const scales = type === 'doughnut' ? {} : {
    x: { stacked, grid: { display: false }, border: { display: false }, ticks: { color: tick, maxRotation: 0, autoSkip: true, autoSkipPadding: 10, callback: p.kind === 'hbar' ? v => (p.money ? usdAxis : fmtY)(v) : function (v) { return trunc(this.getLabelForValue(v), 18) } } },
    y: { stacked, grid: { color: grid }, border: { display: false }, ticks: { color: tick, callback: p.kind === 'hbar' ? function (v) { return trunc(this.getLabelForValue(v), 28) } : v => (p.money ? usdAxis : fmtY)(v) }, beginAtZero: true },
  }
  if (p.kind === 'hbar') { scales.x.grid = { color: grid }; scales.y.grid = { display: false } }
  if (p.y2) scales.y2 = { position: 'right', grid: { display: false }, border: { display: false }, ticks: { color: tick, callback: v => p.y2money ? usd(v) : big(v) }, beginAtZero: true }
  return { type, data: { labels, datasets }, options: {
    responsive: true, maintainAspectRatio: false, indexAxis: p.kind === 'hbar' ? 'y' : 'x', cutout: type === 'doughnut' ? '62%' : undefined,
    interaction: { mode: type === 'doughnut' ? 'nearest' : 'index', intersect: false },
    plugins: {
      legend: { display: datasets.length > 1 || type === 'doughnut', position: type === 'doughnut' ? 'right' : 'bottom', labels: { color: tick, boxWidth: 9, boxHeight: 9, useBorderRadius: true, borderRadius: 2 } },
      tooltip: { backgroundColor: css('--ink'), titleColor: css('--bg'), bodyColor: css('--bg'), padding: 9, cornerRadius: 7, boxPadding: 3,
        itemSort: (a, b) => (b.raw || 0) - (a.raw || 0),
        filter: c => type === 'doughnut' || c.raw !== 0,
        callbacks: { label: c => `${type === 'doughnut' ? c.label : c.dataset.label}: ${(p.y2 && p.y2.includes(c.dataset.label) ? (p.y2money ? usd : big) : fmtY)(c.raw)}`,
          footer: items => stacked && items.length > 1 ? 'total: ' + fmtY(items.reduce((a, i) => a + (+i.raw || 0), 0)) : '' } },
    },
    scales,
  } }
}

/** A panel: spec, DOM, and what it currently shows. Charts are updated in place when new data arrives. */
function makePanel(p, grid, list = state.panels) {
  const el = document.createElement('section')
  el.className = 'panel fade' + (p.wide ? ' wide' : '')
  const chartable = p.kind !== 'table' && p.kind !== 'heatmap'
  el.innerHTML = `<header><div><h3>${esc(p.title)}</h3>${p.note ? `<p class="note">${p.note}</p>` : ''}</div><div class="acts">
    ${p.kind === 'table' ? '<input class="tfilter" placeholder="Filter…">' : ''}
    ${chartable ? `<button data-a="view" title="Chart / table">${ICON.table}</button>` : ''}
    <button data-a="csv" title="Download CSV">${ICON.csv}</button><button data-a="max" title="Expand (esc closes)">${ICON.max}</button></div></header>
    <div class="body"><div class="skel ${p.kind === 'table' ? 's' : ''}"></div></div>`
  grid.appendChild(el)
  const P = { p, el, body: el.querySelector('.body'), chart: null, data: null, view: p.kind === 'table' ? 'table' : 'chart', sort: { col: -1, asc: false }, filter: '' }
  el.querySelector('[data-a="max"]').onclick = () => toggleMax(P)
  el.querySelector('[data-a="csv"]').onclick = () => P.data && csv(p.title, P.data)
  const v = el.querySelector('[data-a="view"]')
  if (v) v.onclick = () => { P.view = P.view === 'chart' ? 'table' : 'chart'; v.innerHTML = P.view === 'chart' ? ICON.table : ICON.chart; fill(P, P.data) }
  const f = el.querySelector('.tfilter')
  if (f) f.oninput = () => { P.filter = f.value.toLowerCase(); drawTable(P) }
  list.push(P)
  return P
}
function destroyChart(P) { if (P.chart) { P.chart.destroy(); P.chart = null } }
function fill(P, d, opts) {
  if (!d) { P.body.innerHTML = '<div class="err">query missing</div>'; return }
  if (P.p.top) d = { cols: d.cols, rows: d.rows.slice(0, P.p.top) }
  P.data = d
  if (P.p.kind === 'heatmap') { destroyChart(P); return heatmap(P.body, d) }
  if (P.view === 'table') return drawTable(P, opts)
  drawChart(P)
}
function drawChart(P) {
  const d = P.data
  if (!d.rows.length) { destroyChart(P); P.body.innerHTML = '<div class="empty">No data for this filter</div>'; return }
  const cfg = chartConfig(P.p, d)
  const c = P.chart
  if (c && c.config.type === cfg.type && P.body.contains(c.canvas)) {
    const old = Object.fromEntries(c.data.datasets.map(ds => [ds.label, ds]))
    c.data.labels = cfg.data.labels
    c.data.datasets = cfg.data.datasets.map(ds => old[ds.label] ? Object.assign(old[ds.label], { data: ds.data, backgroundColor: ds.backgroundColor }) : ds)
    c.update()
    return
  }
  destroyChart(P)
  P.body.innerHTML = `<div class="chart ${P.p.tall ? 'tall' : P.p.short ? 'short' : ''}"><canvas></canvas></div>`
  P.chart = new Chart(P.body.querySelector('canvas'), cfg)
}
function drawTable(P, opts = P.opts || {}) {
  P.opts = opts
  destroyChart(P)
  const d = P.data, el = P.body
  if (!d) return
  if (!d.rows.length) { el.innerHTML = '<div class="empty">No data for this filter</div>'; return }
  const long = new Set(opts.long || ['text', 'prompt', 'description', 'title', 'error', 'target', 'section'])
  let rows = d.rows
  if (P.filter) rows = rows.filter(r => r.some(v => v != null && String(v).toLowerCase().includes(P.filter)))
  const { col, asc } = P.sort
  if (col >= 0) rows = rows.slice().sort((a, b) => { const x = a[col] ?? -Infinity, y = b[col] ?? -Infinity; return x > y ? (asc ? 1 : -1) : x < y ? (asc ? -1 : 1) : 0 })
  const LIMIT = 500, shown = rows.slice(0, LIMIT)
  const barCols = d.cols.map((c, i) => /cost|saved|spent|usd|result_chars|^chars$/.test(c) && d.rows.some(r => typeof r[i] === 'number') ? Math.max(...d.rows.map(r => +r[i] || 0)) : 0)
  const hide = new Set(opts.hide || [])
  const numCol = d.cols.map((c, i) => d.rows.some(r => typeof r[i] === 'number'))
  const prev = el.querySelector('.tbl'), top = prev ? prev.scrollTop : 0
  el.innerHTML = `<div class="tbl"><table><thead><tr>${d.cols.map((c, i) => hide.has(c) ? '' : `<th data-i="${i}" class="${numCol[i] ? 'num' : ''}">${esc(opts.heads?.[c] ?? c)}${i === col ? (asc ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${
    shown.map(r => `<tr class="${opts.rowClass ? opts.rowClass(r) : ''}">${r.map((v, i) => {
      const c = d.cols[i]
      if (hide.has(c)) return ''
      const custom = opts.cell && opts.cell(c, v, r)
      if (custom != null) return custom
      if (c === 'session_id' && v) return `<td><a data-sid="${esc(v)}" title="Open session">${esc(String(v).slice(0, 8))}</a></td>`
      const style = barCols[i] && typeof v === 'number' && v > 0 ? ` style="background:linear-gradient(90deg,transparent ${100 - 100 * v / barCols[i]}%,var(--bar) 0)"` : ''
      return `<td class="${typeof v === 'number' ? 'num' : long.has(c) ? 'long' : ''}"${style} title="${typeof v === 'string' && v.length > 60 ? esc(v.slice(0, 2000)) : ''}">${esc(fmtCell(c, v))}</td>`
    }).join('')}</tr>`).join('')}</tbody></table></div>${rows.length > LIMIT ? `<div class="more">Showing ${LIMIT} of ${rows.length} rows · download CSV for all</div>` : P.filter ? `<div class="more">${rows.length} of ${d.rows.length} rows</div>` : ''}`
  el.querySelector('.tbl').scrollTop = top
  el.querySelectorAll('th').forEach(th => th.onclick = () => {
    const i = +th.dataset.i; P.sort = { col: i, asc: P.sort.col === i ? !P.sort.asc : false }; drawTable(P)
  })
  el.querySelectorAll('a[data-sid]').forEach(a => a.onclick = () => openSession(a.dataset.sid))
}
function heatmap(el, d) {
  const o = asObjs(d), m = {}
  let max = 0
  o.forEach(r => { m[r.weekday + '-' + r.hour] = r.cost; max = Math.max(max, r.cost) })
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], acc = css('--accent')
  let h = '<div class="heat"><div></div>' + [...Array(24).keys()].map(i => `<div>${i}</div>`).join('')
  for (const w of [1, 2, 3, 4, 5, 6, 0]) {
    h += `<div>${days[w]}</div>`
    for (let i = 0; i < 24; i++) {
      const v = m[w + '-' + i] || 0, a = max ? Math.sqrt(v / max) : 0
      h += `<div title="${days[w]} ${i}:00 — ${usd(v)}" style="background:${acc}${Math.round(a * 255).toString(16).padStart(2, '0')}"></div>`
    }
  }
  el.innerHTML = h + '</div>'
}
function csv(title, d) {
  const q = v => v == null ? '' : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v)
  const text = [d.cols.map(q).join(','), ...d.rows.map(r => r.map(q).join(','))].join('\n')
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }))
  a.download = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.csv'
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}
let maxed = null
function toggleMax(P) {
  if (maxed && maxed !== P) toggleMax(maxed)
  const on = !P.el.classList.contains('max')
  P.el.classList.toggle('max', on); $('#scrim').classList.toggle('on', on); document.body.classList.toggle('noscroll', on)
  maxed = on ? P : null
  if (P.chart) setTimeout(() => P.chart.resize(), 0)
}
$('#scrim').onclick = () => maxed && toggleMax(maxed)

/** Fetch the current tab's data and fill it in place (charts animate to the new values). */

// ---------- KPIs ----------
function spark(vals, color) {
  const v = vals.filter(x => x != null)
  if (v.length < 2) return ''
  const max = Math.max(...v), min = Math.min(...v, 0), w = 76, h = 26, n = vals.length
  const pts = vals.map((x, i) => [i * w / (n - 1), h - 2 - ((x ?? 0) - min) / ((max - min) || 1) * (h - 4)])
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('')
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${line}L${w} ${h}L0 ${h}Z" fill="${color}" opacity=".12"/><path d="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`
}
function deltaHtml(cur, prev, sense, label) {
  if (label === 'none') return '<span class="delta" style="color:var(--faint)">no full previous period</span>'
  if (cur == null || prev == null || !state.compare) return '<span class="delta">&nbsp;</span>'
  if (!prev) return `<span class="delta">new vs ${esc(label || 'previous')}</span>`
  const d = (cur - prev) / Math.abs(prev), up = d > 0
  const cls = Math.abs(d) < .02 ? '' : `${up ? 'up' : 'down'} ${sense === 0 ? '' : (up === (sense > 0)) ? 'good' : 'bad'}`
  return `<span class="delta ${cls}">${up ? '▲' : '▼'} ${Math.abs(100 * d).toFixed(Math.abs(d) < .1 ? 1 : 0)}% <span style="color:var(--faint)">vs ${esc(label || 'prev')}</span></span>`
}
let lastKpis = {}
async function renderKpis(seq) {
  try {
    const pr = prevRange(), n = +state.days
    const [cur, daily, prev, live] = await Promise.all([
      api('/api/kpis'), api('/api/kpi_daily'),
      state.compare && pr && n > 1 ? api('/api/kpis', { days: 0, from: pr.from, to: pr.to }) : null,
      state.compare && n === 1 ? api('/api/live') : null,
    ])
    if (seq !== state.seq) return
    const k = asObjs(cur)[0] || {}, p = prev ? asObjs(prev)[0] || {} : {}, dd = asObjs(daily)
    const series = f => dd.map(f)
    const label = n === 1 ? 'yesterday by now' : `prev ${n}d`
    if (n > 1 && !pr && state.compare) Object.assign(p, { _none: true })
    const acc = css('--accent'), mut = css('--muted')
    const cards = [
      ['cost', usd(k.cost), 'spend (list price)', n === 1 ? live?.today.yesterdaySameTime : p.cost, -1, series(r => r.cost), acc, 'hero'],
      ['cost_per_day', usd(k.cost_per_day), 'per active day', p.cost_per_day, -1, null],
      ['sessions', big(k.sessions), 'sessions', p.sessions, 0, series(r => r.sessions), mut],
      ['cost_per_session', usd(k.cost_per_session), 'per session', p.cost_per_session, -1, series(r => r.sessions ? r.cost / r.sessions : null), mut],
      ['requests', big(k.requests), 'requests', p.requests, 0, series(r => r.requests), mut],
      ['hit_pct', pct(k.hit_pct), 'cache hit', p.hit_pct, 1, series(r => r.hit_pct), mut],
      ['avg_context', big(k.avg_context), 'avg context', p.avg_context, -1, series(r => r.avg_context), mut],
      ['output', big(k.output), 'output tokens', p.output, 0, series(r => r.output), mut],
      ['subagent_cost', usd(k.subagent_cost), 'in subagents', p.subagent_cost, -1, series(r => r.subagent_cost), mut],
      ['tool_calls', big(k.tool_calls), 'tool calls', p.tool_calls, 0, series(r => r.tool_calls), mut],
    ]
    $('#kpis').innerHTML = cards.map(([key, v, l, prevV, sense, sp, color, cls]) => {
      const curV = key === 'cost' ? k.cost : k[key]
      const bump = lastKpis[key] != null && lastKpis[key] !== curV ? ' bump' : ''
      return `<div class="kpi ${cls || ''}" title="${esc(l)}"><small>${l}</small><b class="${bump}">${v}</b>${deltaHtml(curV, n === 1 && key !== 'cost' ? null : prevV, sense, p._none ? (key === 'cost' ? 'none' : '') : label)}${sp && dd.length > 1 ? spark(sp, color) : ''}</div>`
    }).join('')
    lastKpis = Object.fromEntries(cards.map(([key]) => [key, k[key]]))
    setTimeout(() => document.querySelectorAll('.kpi b.bump').forEach(b => b.classList.remove('bump')), 900)
  } catch (e) { $('#kpis').innerHTML = `<div class="err">${esc(e.message)}</div>` }
}

// ---------- overview insights ----------
async function insights(seq) {
  const el = $('#insights'); if (!el) return
  const [d, live] = await Promise.all([api('/api/batch', { q: 'kpis,kpi_daily,ctx_buckets,tools,read_ranges,edit_vs_write,parallelism,by_agent_type,search_vs_lsp' }), api('/api/live')])
  if (seq !== state.seq) return
  const k = asObjs(d.kpis)[0] || {}, total = k.cost || 0, out = []
  const m = live.month
  if (m.mtd) out.push([m.projected && m.previous && m.projected > m.previous * 1.1 ? 'warn' : '', `This month so far <b>${usd(m.mtd)}</b> (${m.elapsedPct}% of the month)${m.projected ? `, on pace for <b>${usd(m.projected)}</b>` : ''}${m.previous ? `; last month ${usd(m.previous)}` : ''}.`])
  const days = asObjs(d.kpi_daily).filter(r => r.cost != null)
  if (days.length >= 7) {
    const xs = days.map(r => r.cost), mean = xs.reduce((a, b) => a + b, 0) / xs.length, sd = Math.sqrt(xs.reduce((a, b) => a + (b - mean) ** 2, 0) / xs.length)
    const spikes = days.filter(r => r.cost > mean + 2 * sd && r.cost > mean * 1.5).sort((a, b) => b.cost - a.cost).slice(0, 3)
    if (spikes.length) out.push(['warn', `Spend spike${spikes.length > 1 ? 's' : ''}: ${spikes.map(r => `<b>${r.day}</b> ${usd(r.cost)}`).join(', ')} (typical day ${usd(mean)}). Check Projects & sessions for those days.`])
  }
  const ctx = asObjs(d.ctx_buckets), over = ctx.filter(r => r.lo >= 200000).reduce((a, r) => a + r.cost, 0)
  if (total && over / total > .15) out.push(['warn', `<b>${pct(100 * over / total)}</b> of spend (${usd(over)}) came from requests above 200k context. Compacting or clearing earlier, and handing big reads to subagents, cuts this.`])
  const tools = asObjs(d.tools), bash = tools.find(t => t.tool === 'Bash'), allOut = tools.reduce((a, t) => a + (t.result_chars || 0), 0)
  if (bash && allOut) out.push(['', `Bash produced <b>${pct(100 * bash.result_chars / allOut)}</b> of all tool output (${big(bash.result_chars)} chars). See Tools → Bash commands for the heaviest ones.`])
  const whole = asObjs(d.read_ranges).find(r => r.kind === 'whole file')
  if (whole) out.push(['', `${big(whole.reads)} whole-file Reads returned ${big(whole.chars)} chars (avg ${big(whole.avg_chars)}). Ranged reads after a grep/LSP lookup return far less.`])
  const ew = Object.fromEntries(asObjs(d.edit_vs_write).map(r => [r.tool, r]))
  if (ew.Write && ew.Edit && ew.Write.input_chars > ew.Edit.input_chars) out.push(['warn', `Write sent ${big(ew.Write.input_chars)} chars vs Edit ${big(ew.Edit.input_chars)}: whole-file rewrites dominate. Edit the changed part instead.`])
  const par = asObjs(d.parallelism), reqs = par.reduce((a, r) => a + r.requests, 0), single = par.filter(r => r.tools_in_request === '1').reduce((a, r) => a + r.requests, 0)
  if (reqs && single / reqs > .6) out.push(['', `<b>${pct(100 * single / reqs)}</b> of requests made exactly one tool call. Independent reads in parallel would save whole round trips.`])
  if (total) out.push([k.hit_pct > 90 ? 'good' : 'warn', `Cache hit rate <b>${pct(k.hit_pct)}</b>; ${usd(k.subagent_cost)} (${pct(100 * (k.subagent_cost || 0) / total)}) spent inside subagents.`])
  const lsp = asObjs(d.search_vs_lsp).reduce((a, r) => [a[0] + r.lsp, a[1] + r.text_search], [0, 0])
  if (lsp[1]) out.push([lsp[0] ? 'good' : 'warn', `LSP calls: <b>${lsp[0]}</b> vs ${lsp[1]} grep/rg/find searches.`])
  el.innerHTML = out.map(([c, t]) => `<div class="insight ${c}">${t}</div>`).join('')
}

  const ctxCell = v => { if (v == null) return '<td></td>'; const cap = v > 200000 ? 1000000 : 200000, w = Math.min(100, 100 * v / cap); return `<td><span class="gauge"><span class="meter"><i class="${v > 250000 ? 'hot' : v > 150000 ? 'warm' : ''}" style="width:${w}%"></i></span>${big(v)}</span></td>` }
  const agoCell = v => `<td class="num" data-ts="${esc(v)}">${ago(v)}</td>`
  fill(P.active, L.active, { hide: ['last_ts'], cell: (c, v, r) => c === 'context' ? ctxCell(v) : c === 'model' ? `<td>${esc(shortModel(v))}</td>` : c === 'title' ? `<td class="long">${esc(v || '')}</td>` : null,
    heads: { cost_last_hour: 'last hour' }, long: ['title'] })
  if (P.active.data.rows.length) {
    // last seen column at the end, rendered from last_ts
    const d = P.active.data
    P.active.data = { cols: [...d.cols, 'seen'], rows: d.rows.map(r => [...r, r[d.cols.indexOf('last_ts')]]) }
    P.active.opts.cell = ((base) => (c, v, r) => c === 'seen' ? agoCell(v) : base(c, v, r))(P.active.opts.cell)
    drawTable(P.active)
  }
  const feedIds = new Set(L.feed.rows.map(r => r[L.feed.cols.indexOf('msg_id')]))
  const fresh = new Set([...feedIds].filter(id => !seenFeed.has(id)))
  const first = seenFeed.size === 0
  fill(P.feed, L.feed, { hide: ['msg_id'], rowClass: r => !first && fresh.has(r[L.feed.cols.indexOf('msg_id')]) ? 'new' : '',
    cell: (c, v) => c === 'ts' ? agoCell(v) : c === 'model' ? `<td>${esc(shortModel(v))}</td>` : null, heads: { ts: 'when' } })
  feedIds.forEach(id => seenFeed.add(id))
  const toolIds = new Set(L.tools.rows.map(r => 't' + r[L.tools.cols.indexOf('id')]))
  const freshT = new Set([...toolIds].filter(id => !seenFeed.has(id)))
  fill(P.tools, L.tools, { hide: ['id'], long: ['target'], rowClass: r => !first && freshT.has('t' + r[L.tools.cols.indexOf('id')]) ? 'new' : '',
    cell: (c, v) => c === 'ts' ? agoCell(v) : c === 'is_error' ? `<td>${v ? '<span class="pill err">error</span>' : ''}</td>` : null, heads: { ts: 'when', is_error: '' } })
  toolIds.forEach(id => seenFeed.add(id))
  status()
}
setInterval(() => document.querySelectorAll('[data-ts]').forEach(el => el.textContent = ago(el.dataset.ts)), 5000)

// ---------- Mod impact / Savings / SQL (custom tabs) ----------
async function renderImpact(view) {
  view.innerHTML = `<p class="tabnote">Every mod leaves a random share of sessions untouched (the <b>holdout</b>) and logs what it <i>would</i> have done there.
    <b>Verdict</b> compares cost per prompt in active vs holdout sessions, with a bootstrap 95% interval: a verdict appears only once the interval excludes zero.
    <b>Ledger</b> prices each mod's own actions (text it adds to every request, classifier calls, keep-alive pings) against what it kept out of context; it is an upper bound on savings, the holdout comparison is the real answer. Uses the period and profile filters.</p><div class="skel"></div>`
  teardown()
  $('#status').textContent = 'Loading…'
  const r = await api('/api/impact')
  view.querySelector('.skel').remove()
  const cls = { saving: 'good', costing: 'bad', collecting: '', unclear: 'warn' }
  const sign = v => v == null ? '–' : (v > 0 ? '+' : '') + (100 * v).toFixed(0) + '%'
  view.insertAdjacentHTML('beforeend', `<div class="insights">${r.mods.map(m => `<div class="insight ${cls[m.verdict[0]]}"><b>${esc(m.mod)}</b>: ${esc(m.verdict[1])}${m.costs.length || m.savings.length ? ` · ledger net <b>${usd(m.net)}</b>` : ''}</div>`).join('')}
    <div class="insight good"><b>usage-analytics</b>: ${esc(r.observer.note)}</div></div>`)
  for (const m of r.mods) {
    view.insertAdjacentHTML('beforeend', `<h2 class="sec">${esc(m.mod)} <small>holdout share ${m.holdoutShare == null ? '?' : (100 * m.holdoutShare).toFixed(0) + '%'}</small></h2>`)
    const grid = document.createElement('div'); grid.className = 'grid'; view.appendChild(grid)
    const add = (p, d) => fill(makePanel(p, grid), d)
    const fx = m.effects.map(e => [e.metric, e.on, e.holdout, sign(e.diff), e.lo == null ? '' : `${sign(e.lo)} … ${sign(e.hi)}`])
    add({ title: 'Active vs holdout sessions', note: `${m.arms.on?.sessions || 0} active · ${m.arms.holdout?.sessions || 0} holdout sessions`, kind: 'table' }, { cols: ['metric', 'active', 'holdout', 'diff', '95% interval'], rows: fx.map(([k, a, b, d, ci]) => [k, k.includes('cost') ? usd(a) : big(a), k.includes('cost') ? usd(b) : big(b), d, ci]) })
    add({ title: 'Ledger: saved vs own cost (active sessions)', kind: 'table' }, { cols: ['', 'item', 'usd', 'times'], rows: [...m.savings.map(x => ['+', ...x]), ...m.costs.map(x => ['−', ...x])] })
    if (m.compliance.length) add({ title: 'Nudges followed (vs would-have-been in holdout)', kind: 'table' }, { cols: ['nudge', 'arm', 'followed', 'total', 'followed_pct'], rows: m.compliance })
    add({ title: 'Actions', kind: 'table' }, { cols: ['kind', 'arm', 'n'], rows: m.actions })
    if (m.warnings.length) view.insertAdjacentHTML('beforeend', `<div class="insights" style="margin-top:12px">${m.warnings.map(w => `<div class="insight warn">${esc(w)}</div>`).join('')}</div>`)
  }
  const grid = document.createElement('div'); grid.className = 'grid'; grid.style.marginTop = '14px'; view.appendChild(grid)
  const agg = {}, daily = { cols: ['day', 'mod', 'n'], rows: [] }
  asObjs(r.daily).forEach(o => agg[o.day + '|' + o.mod] = (agg[o.day + '|' + o.mod] || 0) + o.n)
  Object.entries(agg).forEach(([k, n]) => daily.rows.push([...k.split('|'), n]))
  fill(makePanel({ title: 'Mod actions per day', kind: 'stacked', x: 'day', series: 'mod', y: 'n', wide: true }, grid), daily)
  status()
}

async function renderSavings(view) {
  view.innerHTML = '<p class="tabnote">From budget-guard’s session ledgers (all time, not filtered): estimated dollars each lever avoided.</p>'
  teardown()
  const grid = document.createElement('div'); grid.className = 'grid'; view.appendChild(grid)
  const s = await (await fetch('/api/savings')).json()
  const add = (p, d) => fill(makePanel(p, grid), d)
  add({ title: 'Saved by lever', kind: 'hbar', x: 'lever', y: 'saved', money: true }, s.byLever)
  add({ title: 'Levers', kind: 'table' }, s.byLever)
  add({ title: 'Saved vs spent per day', kind: 'bar', x: 'day', y: ['spent', 'saved'], money: true, wide: true }, s.byDay)
  add({ title: 'By profile', kind: 'table' }, s.byProfile)
  status()
}

const EXAMPLES = {
  'Top 20 costliest requests': "SELECT ts, profile, model, context_tokens, output, ROUND(cost_usd, 3) cost, agent_type, session_id FROM v_requests ORDER BY cost_usd DESC LIMIT 20",
  'Spend per profile per week': "SELECT strftime('%Y-W%W', day) week, profile, ROUND(SUM(cost_usd), 2) cost FROM requests GROUP BY 1, 2 ORDER BY 1 DESC",
  'Biggest single tool results': "SELECT ts, tool, COALESCE(cmd, file) target, result_chars, session_id FROM tool_uses ORDER BY result_chars DESC LIMIT 30",
  'Last hour, per session': "SELECT session_id, profile, project, COUNT(*) requests, ROUND(SUM(cost_usd), 2) cost FROM requests WHERE ts >= strftime('%Y-%m-%dT%H:%M:%S', 'now', '-1 hour') GROUP BY 1 ORDER BY cost DESC",
  'Schema': "SELECT type, name, sql FROM sqlite_master WHERE type IN ('table', 'view') ORDER BY type, name",
}
function renderSql(view) {
  if ($('#sqlText')) return
  view.insertAdjacentHTML('beforeend', `<section class="panel sql"><header><div><h3>SQL console</h3><p class="note">Read-only. Tables: requests, tool_uses, prompts, attachments, system_events, sessions, agents, events; views v_*. <kbd>⌘</kbd>+<kbd>↵</kbd> runs.</p></div></header>
    <div class="row">${Object.keys(EXAMPLES).map(k => `<button data-ex="${esc(k)}">${esc(k)}</button>`).join('')}</div>
    <textarea id="sqlText" spellcheck="false">${esc(EXAMPLES['Top 20 costliest requests'])}</textarea>
    <div class="row"><button id="sqlRun" class="btn primary">Run</button><button id="sqlCsv" class="btn">CSV</button><span id="sqlInfo" class="note" style="color:var(--muted)"></span></div><div id="sqlOut"></div></section>`)
  const saved = store.get('cu-sql'); if (saved) $('#sqlText').value = saved
  const P = { p: { kind: 'table', title: 'query' }, body: $('#sqlOut'), sort: { col: -1, asc: false }, filter: '' }
  const run = async () => {
    const sql = $('#sqlText').value; store.set('cu-sql', sql)
    const t = performance.now()
    const r = await fetch('/api/sql', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sql }) })
    const j = await r.json()
    if (!r.ok) { $('#sqlOut').innerHTML = `<div class="err">${esc(j.error)}</div>`; return }
    $('#sqlInfo').textContent = `${j.rows.length} rows · ${Math.round(performance.now() - t)} ms`
    P.data = j; P.sort = { col: -1, asc: false }
    drawTable(P, { long: j.cols })
  }
  $('#sqlRun').onclick = run
  $('#sqlCsv').onclick = () => P.data && csv('query', P.data)
  $('#sqlText').onkeydown = e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') run() }
  view.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { $('#sqlText').value = EXAMPLES[b.dataset.ex]; run() })
  status()
}

// ---------- session drawer ----------
let drawerPanels = []
async function openSession(sid) {
  $('#drawer').classList.add('open'); document.body.classList.add('noscroll')
  drawerPanels.forEach(destroyChart); drawerPanels = []
  const body = $('#drawerBody')
  body.innerHTML = '<div class="skel" style="height:40px;margin-bottom:12px"></div><div class="skel"></div>'
  const s = await (await fetch('/api/session?id=' + encodeURIComponent(sid))).json()
  const info = asObjs(s.info)[0] || {}
  const tl = asObjs(s.timeline)
  const cost = tl.reduce((a, r) => a + (r.cost || 0), 0)
  const facts = [info.profile, info.project, info.git_branch, `${tl.length} requests`, `${usd(cost)} list price`, info.cc_cost_usd ? `Claude Code said ${usd(info.cc_cost_usd)}` : null].filter(Boolean)
  body.innerHTML = `<div class="dhead"><button id="close" class="btn">✕</button><h3>${esc(info.title || sid)}</h3></div>
    <div class="facts"><span class="pill"><code>${esc(sid)}</code></span>${facts.map(f => `<span class="pill">${esc(f)}</span>`).join('')}</div>
    <div class="grid"></div>`
  $('#close').onclick = closeDrawer
  const grid = body.querySelector('.grid')
  const add = (p, d) => fill(makePanel(p, grid, drawerPanels), d)
  let run = 0
  const ctx = { cols: ['n', 'context', 'cumulative_cost'], rows: tl.map((r, i) => [i + 1, r.agent === 'main' ? r.context : null, (run += r.cost || 0)]) }
  add({ title: 'Main-loop context and cumulative cost per request', kind: 'line', x: 'n', y: ['context', 'cumulative_cost'], y2: ['cumulative_cost'], y2money: true, wide: true }, ctx)
  const byAgent = {}; tl.forEach(r => { byAgent[r.agent] = (byAgent[r.agent] || 0) + (r.cost || 0) })
  add({ title: 'Cost by agent', kind: 'doughnut', x: 'agent', y: 'cost', money: true }, { cols: ['agent', 'cost'], rows: Object.entries(byAgent) })
  const byTool = {}; asObjs(s.tools).forEach(t => { byTool[t.tool] = (byTool[t.tool] || 0) + (t.result_chars || 0) })
  add({ title: 'Tool output by tool', kind: 'hbar', x: 'tool', y: 'chars' }, { cols: ['tool', 'chars'], rows: Object.entries(byTool).sort((a, b) => b[1] - a[1]).slice(0, 12) })
  add({ title: 'Prompts', kind: 'table', wide: true }, s.prompts)
  add({ title: 'Tool calls', kind: 'table', wide: true }, s.tools)
  add({ title: 'Subagents', kind: 'table' }, s.agents)
  add({ title: 'Requests', kind: 'table', wide: true }, s.timeline)
}
function closeDrawer() { $('#drawer').classList.remove('open'); document.body.classList.remove('noscroll'); drawerPanels.forEach(destroyChart); drawerPanels = [] }
$('#drawer').onclick = e => { if (e.target.id === 'drawer') closeDrawer() }

// ---------- status, meta, filters ----------
function status() {
  const m = state.meta
  $('#status').textContent = m ? `${m.range[0]} → ${m.range[1]} · ingested ${m.lastIngest ? ago(m.lastIngest) : 'never'} · ${big(m.modEvents)} mod events` : ''
}
async function loadMeta() {
  state.meta = await (await fetch('/api/meta')).json()
  state.meta.profiles.forEach(colorFor)
  $('#profiles').innerHTML = state.meta.profiles.map(p => `<span class="chip ${state.profiles.has(p) ? 'on' : ''}" data-p="${esc(p)}"><i style="background:${colorFor(p)}"></i>${esc(p.replace(/^claude-/, ''))}</span>`).join('')
  $('#profiles').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.profiles.has(c.dataset.p) ? state.profiles.delete(c.dataset.p) : state.profiles.add(c.dataset.p)
    c.classList.toggle('on'); render()
  })
  const cur = $('#model').value
  $('#model').innerHTML = '<option value="">All models</option>' + state.meta.models.map(m => `<option ${m === cur ? 'selected' : ''}>${esc(m)}</option>`).join('')
}
const PERIODS = [['1', 'Today'], ['7', '7d'], ['14', '14d'], ['30', '30d'], ['90', '90d'], ['0', 'All']]
function buildPeriod() {
  $('#period').innerHTML = PERIODS.map(([v, l]) => `<button data-d="${v}" class="${v === state.days ? 'on' : ''}">${l}</button>`).join('')
  $('#period').querySelectorAll('button').forEach(b => b.onclick = () => setDays(b.dataset.d))
}
function setDays(v) { state.days = v; store.set('cu-days', v); buildPeriod(); render() }
function cycleTheme() {
  const order = ['system', 'light', 'dark'], cur = store.get('cu-theme', 'system'), next = order[(order.indexOf(cur) + 1) % 3]
  store.set('cu-theme', next); applyTheme(); toast(`Theme: ${next}`); render()
}
function applyTheme() {
  const t = store.get('cu-theme', 'system')
  if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t
  $('#theme').textContent = { system: 'Theme: auto', light: 'Theme: light', dark: 'Theme: dark' }[t]
}
let toastT
function toast(text) { const t = $('#toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200) }
async function ingestNow() {
  $('#ingest').disabled = true; toast('Ingesting…')
  try {
    const r = await (await fetch('/api/ingest', { method: 'POST' })).json()
    toast(`Ingested in ${r.seconds}s`)
  } finally { $('#ingest').disabled = false }
  await loadMeta(); refresh()
}

// ---------- live updates (server-sent events) ----------
let liveTimer = null, lastLive = 0
function liveUi(cls, text) { const l = $('#live'); l.classList.remove('on', 'off'); if (cls) l.classList.add(cls); $('#liveText').textContent = text }
function scheduleLive() {
  if (document.hidden) { state.pendingLive = true; return }
  clearTimeout(liveTimer)
  const wait = Math.max(400, 2500 - (Date.now() - lastLive))
  liveTimer = setTimeout(async () => {
    lastLive = Date.now()
    if (maxed || $('#palette').classList.contains('open')) { scheduleLive(); return }
    await loadMeta().catch(() => {})
    refresh({ live: true })
  }, wait)
}
function connectLive() {
  if (!window.EventSource) return liveUi('off', 'live updates unsupported')
  const es = new EventSource('/api/stream')
  es.addEventListener('hello', () => { liveUi('on', 'Live'); state.lastUpdate = null })
  es.addEventListener('update', e => {
    state.lastUpdate = Date.now()
    const l = $('#live'); l.classList.remove('flash'); void l.offsetWidth; l.classList.add('flash')
    scheduleLive()
  })
  es.onerror = () => liveUi('off', 'reconnecting…')
  es.onopen = () => liveUi('on', 'Live')
}
setInterval(() => { if ($('#live').classList.contains('on')) $('#liveText').textContent = state.lastUpdate ? `Live · updated ${ago(state.lastUpdate)}` : 'Live · waiting for activity' }, 1000)
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.pendingLive) { state.pendingLive = false; scheduleLive() } })

// ---------- command palette & keys ----------
function commands() {
  const c = [
    ...ORDER.map(k => ({ label: TABS[k].label, hint: 'go to · ' + (TABS[k].sub || ''), run: () => go(k) })),
    ...PERIODS.map(([v, l]) => ({ label: `Period: ${l === 'All' ? 'all time' : l}`, hint: 'filter', run: () => setDays(v) })),
    { label: 'Ingest now', hint: 'action', run: ingestNow },
    { label: 'Refresh', hint: 'action · r', run: () => refresh() },
    { label: 'Toggle theme', hint: 'action · t', run: cycleTheme },
    { label: `${state.compare ? 'Hide' : 'Show'} change vs previous period`, hint: 'action', run: () => { $('#compare').click() } },
    { label: 'All profiles', hint: 'filter', run: () => { state.profiles.clear(); loadMeta().then(render) } },
    ...(state.meta?.profiles || []).map(p => ({ label: `Only ${p}`, hint: 'filter', run: () => { state.profiles = new Set([p]); loadMeta().then(render) } })),
    { label: 'Clear filters', hint: 'filter', run: () => { state.profiles.clear(); $('#model').value = ''; $('#project').value = ''; loadMeta().then(render) } },
  ]
  return c
}
let palItems = [], palIdx = 0
function score(q, s) { s = s.toLowerCase(); if (!q) return 1; if (s.includes(q)) return 3 - s.indexOf(q) / 100; let i = 0; for (const ch of s) if (ch === q[i]) i++; return i === q.length ? 1 : 0 }
function drawPalette() {
  const q = $('#palInput').value.trim().toLowerCase()
  palItems = commands().map(c => [score(q, c.label + ' ' + c.hint), c]).filter(([s]) => s > 0).sort((a, b) => b[0] - a[0]).map(([, c]) => c).slice(0, 14)
  palIdx = Math.min(palIdx, Math.max(0, palItems.length - 1))
  $('#palList').innerHTML = palItems.map((c, i) => `<li class="${i === palIdx ? 'on' : ''}" data-i="${i}"><span>${esc(c.label)}</span><small>${esc(c.hint)}</small></li>`).join('') || '<li><small>No match</small></li>'
  $('#palList').querySelectorAll('li[data-i]').forEach(li => { li.onclick = () => runPal(+li.dataset.i); li.onmousemove = () => { if (palIdx !== +li.dataset.i) { palIdx = +li.dataset.i; drawPalette() } } })
}
function openPalette() { $('#palette').classList.add('open'); $('#palInput').value = ''; palIdx = 0; drawPalette(); $('#palInput').focus() }
function closePalette() { $('#palette').classList.remove('open') }
function runPal(i) { const c = palItems[i]; closePalette(); if (c) c.run() }
$('#openPalette').onclick = openPalette
$('#palette').onclick = e => { if (e.target.id === 'palette') closePalette() }
$('#palInput').oninput = () => { palIdx = 0; drawPalette() }
$('#palInput').onkeydown = e => {
  if (e.key === 'ArrowDown') { palIdx = Math.min(palItems.length - 1, palIdx + 1); drawPalette(); e.preventDefault() }
  else if (e.key === 'ArrowUp') { palIdx = Math.max(0, palIdx - 1); drawPalette(); e.preventDefault() }
  else if (e.key === 'Enter') runPal(palIdx)
}
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#palette').classList.contains('open') ? closePalette() : openPalette(); return }
  if (e.key === 'Escape') { if ($('#palette').classList.contains('open')) closePalette(); else if (maxed) toggleMax(maxed); else closeDrawer(); return }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === '/') { e.preventDefault(); $('#project').focus() }
  else if (e.key === 'r') refresh()
  else if (e.key === 't') cycleTheme()
  else if (e.key === '[' || e.key === ']') { const i = ORDER.indexOf(state.tab); go(ORDER[(i + (e.key === ']' ? 1 : ORDER.length - 1)) % ORDER.length]) }
})

// ---------- init ----------
buildNav(); buildPeriod(); applyTheme()
$('#compare').checked = state.compare
$('#compare').onchange = () => { state.compare = $('#compare').checked; store.set('cu-compare', state.compare ? '1' : '0'); renderKpis(state.seq) }
$('#model').onchange = render
$('#refresh').onclick = () => loadMeta().then(render)
$('#theme').onclick = cycleTheme
$('#ingest').onclick = ingestNow
let pt; $('#project').oninput = () => { clearTimeout(pt); pt = setTimeout(render, 400) }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (store.get('cu-theme', 'system') === 'system') render() })
if (!TABS[state.tab]) state.tab = 'overview'
loadMeta().then(render).catch(e => { $('#status').innerHTML = `<span class="err">${esc(e.message)}</span>` })
connectLive()
</script>
