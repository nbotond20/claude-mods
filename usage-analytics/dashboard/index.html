<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Usage</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
  --accent: #c96442; --good: #2f7d4f; --warn: #b7791f; --bad: #b83a3a; --hover: #f0efea;
  --s1: #c96442; --s2: #3d6fb6; --s3: #2f7d4f; --s4: #8a5cb8; --s5: #b7791f; --s6: #4a9fa8; --s7: #b8457a; --s8: #7a7a70;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161614; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9b9a93; --line: #34332f; --hover: #2a2a27;
  --accent: #e08a68; --good: #5bb07f; --warn: #d9a54a; --bad: #e06b6b;
  --s1: #e08a68; --s2: #6f9be0; --s3: #5bb07f; --s4: #b08ae0; --s5: #d9a54a; --s6: #6cc3cc; --s7: #e07aa8; --s8: #a8a89e;
} }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
h1 { font-size: 16px; margin: 0 8px 0 0; }
h1 span { color: var(--accent); }
select, input, button, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
button:hover { background: var(--hover); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); cursor: pointer; user-select: none; color: var(--muted); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.status { color: var(--muted); font-size: 12px; margin-left: auto; }
nav { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; }
nav a { padding: 5px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; color: var(--muted); }
nav a.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
main { padding: 14px 16px 60px; max-width: 1500px; margin: 0 auto; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.panel h3 { margin: 0 0 2px; font-size: 14px; }
.panel p.note { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
.chart { position: relative; height: 280px; }
.chart.tall { height: 380px; }
.tbl { overflow: auto; max-height: 460px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--panel); cursor: pointer; color: var(--muted); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.long { white-space: normal; min-width: 260px; max-width: 520px; }
td a { color: var(--accent); cursor: pointer; }
tr:hover td { background: var(--hover); }
.insights { display: grid; gap: 6px; margin-bottom: 12px; }
.insight { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; }
.insight.good { border-left-color: var(--good); }
.insight.warn { border-left-color: var(--warn); }
.insight.bad { border-left-color: var(--bad); }
.empty { color: var(--muted); padding: 20px; text-align: center; }
.err { color: var(--bad); }
.heat { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 2px; font-size: 10px; color: var(--muted); }
.heat div { height: 22px; border-radius: 3px; display: flex; align-items: center; justify-content: center; }
.drawer { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 10; }
.drawer.open { display: block; }
.drawer > div { position: absolute; right: 0; top: 0; bottom: 0; width: min(1100px, 100%); background: var(--bg); overflow: auto; padding: 16px; }
.sql textarea { width: 100%; min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Claude <span>Usage</span></h1>
    <select id="days" title="Period">
      <option value="1">Today</option><option value="7">7 days</option><option value="14">14 days</option>
      <option value="30" selected>30 days</option><option value="90">90 days</option><option value="0">All time</option>
    </select>
    <div class="chips" id="profiles" title="Profiles (none selected = all)"></div>
    <select id="model"><option value="">All models</option></select>
    <input id="project" placeholder="Project contains…" size="16">
    <button id="refresh">Refresh</button>
    <button id="ingest" title="Fold new transcript and mod data into the database">Ingest now</button>
    <span class="status" id="status"></span>
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <div class="kpis" id="kpis"></div>
  <div id="view"></div>
</main>
<div class="drawer" id="drawer"><div id="drawerBody"></div></div>

<script>
const $ = s => document.querySelector(s)
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
const PALETTE = () => ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'].map(css)
const state = { tab: 'overview', profiles: new Set(), meta: null }
try { state.tab = localStorage.getItem('cu-tab') || 'overview' } catch {}
if (location.hash.length > 1) state.tab = location.hash.slice(1)
addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS[t] && t !== state.tab) { state.tab = t; render() } })

// ---------- formatting ----------
const usd = v => v == null ? '–' : '$' + (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (+v).toFixed(2))
const big = v => { if (v == null) return '–'; const a = Math.abs(v)
  return a >= 1e9 ? (v/1e9).toFixed(2)+'B' : a >= 1e6 ? (v/1e6).toFixed(1)+'M' : a >= 1e4 ? Math.round(v/1e3)+'k' : a >= 1e3 ? (v/1e3).toFixed(1)+'k' : String(Math.round(v*100)/100) }
const pct = v => v == null ? '–' : (+v).toFixed(1) + '%'
const fmtCell = (col, v) => {
  if (v == null) return ''
  if (typeof v !== 'number') return String(v)
  if (/cost|saved|spent|usd/.test(col)) return usd(v)
  if (/pct|share/.test(col)) return pct(v)
  if (/^(hour|weekday|spawn_depth|is_error|deferred)$/.test(col)) return String(v)
  return big(v)
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

// ---------- data ----------
function params(extra = {}) {
  const p = new URLSearchParams({ days: $('#days').value, ...extra })
  if (state.profiles.size) p.set('profile', [...state.profiles].join(','))
  if ($('#model').value) p.set('model', $('#model').value)
  if ($('#project').value.trim()) p.set('project', $('#project').value.trim())
  return p
}
async function api(path, extra) {
  const r = await fetch(path + (path.includes('?') ? '&' : '?') + params(extra))
  const j = await r.json()
  if (!r.ok) throw new Error(j.error || r.status)
  return j
}
const asObjs = d => d.rows.map(r => Object.fromEntries(d.cols.map((c, i) => [c, r[i]])))

// ---------- rendering ----------
const charts = []
function clearCharts() { while (charts.length) charts.pop().destroy() }
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily
Chart.defaults.font.size = 11

function panel(p) {
  const el = document.createElement('section')
  el.className = 'panel' + (p.wide ? ' wide' : '')
  el.innerHTML = `<h3>${esc(p.title)}</h3>${p.note ? `<p class="note">${p.note}</p>` : ''}<div class="body"></div>`
  return el
}

function table(el, d, opts = {}) {
  if (!d.rows.length) { el.innerHTML = '<div class="empty">No data for this filter</div>'; return }
  const long = new Set(opts.long || ['text', 'prompt', 'description', 'title', 'error', 'target', 'section'])
  let rows = d.rows.slice(), sortCol = -1, asc = false
  const draw = () => {
    el.innerHTML = `<div class="tbl"><table><thead><tr>${d.cols.map((c, i) => `<th data-i="${i}">${esc(c)}${i === sortCol ? (asc ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${
      rows.map(r => `<tr>${r.map((v, i) => {
        const c = d.cols[i]
        if (c === 'session_id' && v) return `<td><a data-sid="${esc(v)}">${esc(String(v).slice(0, 8))}</a></td>`
        return `<td class="${typeof v === 'number' ? 'num' : long.has(c) ? 'long' : ''}" title="${typeof v === 'string' && v.length > 60 ? esc(v.slice(0, 2000)) : ''}">${esc(fmtCell(c, v))}</td>`
      }).join('')}</tr>`).join('')}</tbody></table></div>`
    el.querySelectorAll('th').forEach(th => th.onclick = () => {
      const i = +th.dataset.i; asc = sortCol === i ? !asc : false; sortCol = i
      rows.sort((a, b) => (a[i] ?? -Infinity) > (b[i] ?? -Infinity) ? (asc ? 1 : -1) : (a[i] ?? -Infinity) < (b[i] ?? -Infinity) ? (asc ? -1 : 1) : 0)
      draw()
    })
    el.querySelectorAll('a[data-sid]').forEach(a => a.onclick = () => openSession(a.dataset.sid))
  }
  draw()
}

/** Long rows (x, series, y) -> one dataset per series. */
function pivot(objs, x, s, y) {
  const xs = [...new Set(objs.map(o => o[x]))]
  const totals = {}
  objs.forEach(o => totals[o[s]] = (totals[o[s]] || 0) + (o[y] || 0))
  const ss = Object.keys(totals).sort((a, b) => totals[b] - totals[a])
  const idx = Object.fromEntries(xs.map((v, i) => [v, i]))
  const data = Object.fromEntries(ss.map(k => [k, xs.map(() => 0)]))
  objs.forEach(o => data[o[s]][idx[o[x]]] += o[y] || 0)
  return { labels: xs, series: ss.map(k => ({ label: k, data: data[k] })) }
}

function chart(el, p, d) {
  if (!d.rows.length) { el.innerHTML = '<div class="empty">No data for this filter</div>'; return }
  el.innerHTML = `<div class="chart ${p.tall ? 'tall' : ''}"><canvas></canvas></div>`
  const objs = asObjs(d), pal = PALETTE()
  let labels, datasets
  if (p.series) {
    const pv = pivot(objs, p.x, p.series, p.y)
    labels = pv.labels
    datasets = pv.series.slice(0, p.maxSeries || 10).map((s, i) => ({ label: s.label, data: s.data }))
  } else {
    labels = objs.map(o => o[p.x])
    datasets = (Array.isArray(p.y) ? p.y : [p.y]).map(y => ({ label: y, data: objs.map(o => o[y]), yAxisID: p.y2 && p.y2.includes(y) ? 'y2' : 'y' }))
  }
  const type = p.kind === 'stacked' || p.kind === 'hbar' ? 'bar' : p.kind === 'area' ? 'line' : p.kind
  datasets.forEach((ds, i) => {
    const c = type === 'doughnut' ? labels.map((_, j) => pal[j % pal.length]) : pal[i % pal.length]
    Object.assign(ds, { backgroundColor: type === 'line' && p.kind !== 'area' ? c : c, borderColor: type === 'doughnut' ? css('--panel') : c,
      borderWidth: type === 'line' ? 2 : 1, pointRadius: 0, tension: .25, fill: p.kind === 'area', spanGaps: true })
    if (p.kind === 'area') ds.backgroundColor = c + '55'
  })
  const fmtY = p.money ? usd : p.pct ? pct : big
  const grid = css('--line'), tick = css('--muted')
  const stacked = p.kind === 'stacked' || p.kind === 'area'
  const scales = type === 'doughnut' ? {} : {
    x: { stacked, grid: { display: false }, ticks: { color: tick, maxRotation: 0, autoSkip: true, callback: p.kind === 'hbar' ? v => fmtY(v) : function (v) { const l = this.getLabelForValue(v); return String(l).length > 18 ? String(l).slice(0, 17) + '…' : l } } },
    y: { stacked, grid: { color: grid }, ticks: { color: tick, callback: p.kind === 'hbar' ? function (v) { const l = this.getLabelForValue(v); return String(l).length > 28 ? String(l).slice(0, 27) + '…' : l } : v => fmtY(v) }, beginAtZero: true },
  }
  if (p.y2) scales.y2 = { position: 'right', grid: { display: false }, ticks: { color: tick, callback: v => big(v) }, beginAtZero: true }
  charts.push(new Chart(el.querySelector('canvas'), {
    type, data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: p.kind === 'hbar' ? 'y' : 'x', animation: false,
      interaction: { mode: type === 'doughnut' ? 'nearest' : 'index', intersect: false },
      plugins: {
        legend: { display: datasets.length > 1 || type === 'doughnut', position: type === 'doughnut' ? 'right' : 'bottom', labels: { color: tick, boxWidth: 10 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label === p.y && type === 'doughnut' ? c.label : c.dataset.label}: ${(p.y2 && p.y2.includes(c.dataset.label) ? big : fmtY)(c.raw)}` } },
      },
      scales,
    },
  }))
}

function heatmap(el, d) {
  const o = asObjs(d), m = {}
  let max = 0
  o.forEach(r => { m[r.weekday + '-' + r.hour] = r.cost; max = Math.max(max, r.cost) })
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], acc = css('--accent')
  let h = '<div class="heat"><div></div>' + [...Array(24).keys()].map(i => `<div>${i}</div>`).join('')
  for (const w of [1, 2, 3, 4, 5, 6, 0]) {
    h += `<div>${days[w]}</div>`
    for (let i = 0; i < 24; i++) {
      const v = m[w + '-' + i] || 0, a = max ? Math.sqrt(v / max) : 0
      h += `<div title="${days[w]} ${i}:00 — ${usd(v)}" style="background:${acc}${Math.round(a * 255).toString(16).padStart(2, '0')}"></div>`
    }
  }
  el.innerHTML = h + '</div>'
}

// ---------- tabs ----------
const TABS = {
  overview: { label: 'Overview', panels: [
    { title: 'Spend per day by profile', q: 'daily_profile', kind: 'stacked', x: 'day', series: 'profile', y: 'cost', money: true, wide: true },
    { title: 'Where the money goes (token kind)', q: 'cost_kinds', kind: 'doughnut', x: 'kind', y: 'cost', money: true, note: 'Cache reads are the whole context re-read on every request; cache writes are new or changed context.' },
    { title: 'Spend by context size at request time', q: 'ctx_buckets', kind: 'stacked', x: 'bucket', y: ['main_cost', 'subagent_cost'], money: true, note: 'Every request re-reads its whole context: large contexts cost more per call.' },
    { title: 'Profiles', q: 'by_profile', kind: 'table' },
    { title: 'Models', q: 'by_model', kind: 'table' },
    { title: 'When you work (spend by weekday × hour)', q: 'heatmap', kind: 'heatmap' },
    { title: 'Most expensive sessions', q: 'sessions', kind: 'table', wide: true },
  ] },
  cost: { label: 'Cost & tokens', panels: [
    { title: 'Spend per day by model', q: 'daily_model', kind: 'stacked', x: 'day', series: 'model', y: 'cost', money: true, wide: true },
    { title: 'Tokens per day', q: 'daily_tokens', kind: 'area', x: 'day', y: ['cache_read', 'cache_write', 'input', 'output'], wide: true },
    { title: 'Efficiency per day', q: 'daily_efficiency', kind: 'line', x: 'day', y: ['cost_per_1k_req'], money: true, note: 'Cost per 1,000 requests: falls when context is kept small or cheaper models take the work.' },
    { title: 'Cache hit rate & subagent share per day', q: 'daily_efficiency', kind: 'line', x: 'day', y: ['hit_pct', 'subagent_pct'], pct: true },
    { title: 'By effort level', q: 'by_effort', kind: 'table' },
    { title: 'By entrypoint (cli, sdk, ide…)', q: 'by_entrypoint', kind: 'table' },
    { title: 'Stop reasons', q: 'stop_reasons', kind: 'table' },
    { title: 'Claude Code versions', q: 'by_version', kind: 'table' },
    { title: 'Spend by hour of day', q: 'hours', kind: 'bar', x: 'hour', y: 'cost', money: true },
  ] },
  context: { label: 'Context', panels: [
    { title: 'Requests by context size', q: 'ctx_buckets', kind: 'bar', x: 'bucket', y: ['requests'], note: 'Context = input + cache read + cache write of one request.' },
    { title: 'Spend by context size', q: 'ctx_buckets', kind: 'stacked', x: 'bucket', y: ['main_cost', 'subagent_cost'], money: true },
    { title: 'Main-loop context per day', q: 'ctx_daily', kind: 'line', x: 'day', y: ['avg_context', 'max_context'], wide: true },
    { title: 'Tool calls per request (parallelism)', q: 'parallelism', kind: 'bar', x: 'tools_in_request', y: 'requests', note: 'Requests with 0–1 tool calls each re-send the full context for one step. Parallel calls amortise it.' },
    { title: 'Context composition (latest /context breakdown, from the mod)', q: 'mod_context', kind: 'table' },
    { title: 'Context categories over time (mod)', q: 'mod_context_daily', kind: 'stacked', x: 'day', series: 'category', y: 'tokens' },
    { title: 'Injected attachments (reminders, listings, file snapshots…)', q: 'attachments', kind: 'table', wide: true },
  ] },
  tools: { label: 'Tools', panels: [
    { title: 'Tool output by tool (chars into context)', q: 'tools', kind: 'hbar', x: 'tool', y: 'result_chars', tall: true, top: 15 },
    { title: 'All tools', q: 'tools', kind: 'table' },
    { title: 'Tool output per day', q: 'tool_daily', kind: 'stacked', x: 'day', series: 'tool', y: 'result_chars', wide: true },
    { title: 'Result size distribution', q: 'result_sizes', kind: 'stacked', x: 'tool', series: 'size', y: 'calls' },
    { title: 'Bash programs by output', q: 'bash_programs', kind: 'hbar', x: 'program', y: 'result_chars', tall: true },
    { title: 'Bash commands', q: 'bash', kind: 'table', wide: true, note: '<code>capped</code> = cut by lean-tools / budget-guard.' },
    { title: 'Read: whole file vs ranged', q: 'read_ranges', kind: 'table' },
    { title: 'Edit vs Write (input chars)', q: 'edit_vs_write', kind: 'table' },
    { title: 'Files by traffic', q: 'files', kind: 'table', wide: true },
    { title: 'Files read 3+ times in one session', q: 'rereads', kind: 'table', wide: true },
    { title: 'By file extension', q: 'extensions', kind: 'table' },
    { title: 'LSP vs text search per day', q: 'search_vs_lsp', kind: 'bar', x: 'day', y: ['lsp', 'text_search'] },
    { title: 'LSP operations', q: 'lsp', kind: 'table' },
    { title: 'MCP servers', q: 'mcp', kind: 'table' },
    { title: 'Skills', q: 'skills', kind: 'table' },
    { title: 'Web fetch / search', q: 'web', kind: 'table' },
    { title: 'Tool errors', q: 'tool_errors', kind: 'table' },
  ] },
  agents: { label: 'Agents', panels: [
    { title: 'Spend by agent type', q: 'by_agent_type', kind: 'hbar', x: 'agent_type', y: 'cost', money: true },
    { title: 'Agent types', q: 'by_agent_type', kind: 'table' },
    { title: 'Which model each agent type ran on', q: 'agent_model', kind: 'stacked', x: 'agent_type', series: 'model', y: 'cost', money: true },
    { title: 'Spawns (Agent tool calls) by type and model parameter', q: 'agent_spawns', kind: 'table' },
    { title: 'Most expensive subagents', q: 'top_agents', kind: 'table', wide: true },
  ] },
  projects: { label: 'Projects & sessions', panels: [
    { title: 'Spend by project', q: 'by_project', kind: 'hbar', x: 'project', y: 'cost', money: true, tall: true, top: 15 },
    { title: 'Session cost distribution', q: 'session_sizes', kind: 'bar', x: 'size', y: ['sessions'], note: 'Click a session id in any table for its timeline.' },
    { title: 'Projects', q: 'by_project', kind: 'table', wide: true },
    { title: 'Branches', q: 'by_branch', kind: 'table' },
    { title: 'Sessions', q: 'sessions', kind: 'table', wide: true },
  ] },
  prompts: { label: 'Prompts', panels: [
    { title: 'Prompts and commands per day', q: 'prompts_daily', kind: 'stacked', x: 'day', y: ['prompts', 'commands', 'agent_prompts'], wide: true },
    { title: 'Message kinds', q: 'prompt_kinds', kind: 'table' },
    { title: 'Prompt length', q: 'prompt_lengths', kind: 'bar', x: 'length', y: 'prompts' },
    { title: 'Slash commands', q: 'commands', kind: 'table' },
    { title: 'Most expensive prompts (all requests until the next prompt)', q: 'expensive_prompts', kind: 'table', wide: true },
    { title: 'Recent prompts', q: 'recent_prompts', kind: 'table', wide: true },
  ] },
  health: { label: 'Health', panels: [
    { title: 'API errors, compactions, notices per day', q: 'system_daily', kind: 'stacked', x: 'day', series: 'subtype', y: 'n', wide: true },
    { title: 'Turn duration per day', q: 'turn_durations', kind: 'line', x: 'day', y: ['avg_s', 'max_s'] },
    { title: 'Turns per day', q: 'turn_durations', kind: 'bar', x: 'day', y: 'turns' },
    { title: 'Recent API errors', q: 'api_errors', kind: 'table', wide: true },
    { title: 'Compactions (mod)', q: 'mod_compactions', kind: 'table', wide: true },
  ] },
  engine: { label: 'Engine', note: 'From the usage-analytics mod’s own event log: only sessions that ran with the mod installed.', panels: [
    { title: 'Request latency by model', q: 'mod_latency', kind: 'table', note: 'ttft = time to first token.' },
    { title: 'Tool latency', q: 'mod_tool_latency', kind: 'table' },
    { title: 'Tool schemas in the prompt (chars)', q: 'mod_tool_schemas', kind: 'hbar', x: 'tool', y: 'chars', tall: true, top: 20, note: 'Deferred tools sit behind ToolSearch and cost nothing until loaded.' },
    { title: 'Tool schemas', q: 'mod_tool_schemas', kind: 'table' },
    { title: 'System prompt sections', q: 'mod_system_prompt', kind: 'table' },
    { title: 'Rate limits seen', q: 'mod_rate_limits', kind: 'table' },
    { title: 'Mod events', q: 'mod_events', kind: 'table' },
  ] },
  impact: { label: 'Mod impact', custom: renderImpact },
  savings: { label: 'Savings', custom: renderSavings },
  sql: { label: 'SQL', custom: renderSql },
}

async function render() {
  clearCharts()
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === state.tab))
  const tab = TABS[state.tab], view = $('#view')
  view.innerHTML = tab.note ? `<p class="note" style="color:var(--muted)">${tab.note}</p>` : ''
  renderKpis()
  if (tab.custom) return tab.custom(view)
  if (state.tab === 'overview') view.insertAdjacentHTML('beforeend', '<div class="insights" id="insights"></div>')
  const grid = document.createElement('div'); grid.className = 'grid'; view.appendChild(grid)
  const els = tab.panels.map(p => { const el = panel(p); grid.appendChild(el); return el })
  const names = [...new Set(tab.panels.map(p => p.q).filter(q => q !== 'cost_kinds'))]
  $('#status').textContent = 'Loading…'
  try {
    const [data, kinds] = await Promise.all([api('/api/batch', { q: names.join(',') }), tab.panels.some(p => p.q === 'cost_kinds') ? api('/api/cost_kinds') : null])
    if (kinds) data.cost_kinds = kinds
    tab.panels.forEach((p, i) => {
      const body = els[i].querySelector('.body')
      let d = data[p.q]
      if (!d) { body.innerHTML = '<div class="err">query missing</div>'; return }
      if (p.top) d = { cols: d.cols, rows: d.rows.slice(0, p.top) }
      if (p.kind === 'table') table(body, d)
      else if (p.kind === 'heatmap') heatmap(body, d)
      else chart(body, p, d)
    })
    if (state.tab === 'overview') insights()
    status()
  } catch (e) { $('#status').innerHTML = `<span class="err">${esc(e.message)}</span>` }
}

async function renderKpis() {
  try {
    const k = asObjs(await api('/api/kpis'))[0] || {}
    const cards = [
      [usd(k.cost), 'spend (list price)'], [usd(k.cost_per_day), 'per active day'], [big(k.sessions), 'sessions'],
      [usd(k.cost_per_session), 'per session'], [big(k.requests), 'requests'], [pct(k.hit_pct), 'cache hit'],
      [big(k.avg_context), 'avg context'], [big(k.output), 'output tokens'], [usd(k.subagent_cost), 'in subagents'],
      [big(k.tool_calls), 'tool calls'],
    ]
    $('#kpis').innerHTML = cards.map(([v, l]) => `<div class="kpi"><b>${v}</b><small>${l}</small></div>`).join('')
  } catch (e) { $('#kpis').innerHTML = `<div class="err">${esc(e.message)}</div>` }
}

async function insights() {
  const el = $('#insights'); if (!el) return
  const d = await api('/api/batch', { q: 'kpis,ctx_buckets,tools,read_ranges,edit_vs_write,parallelism,by_agent_type,search_vs_lsp' })
  const k = asObjs(d.kpis)[0] || {}, total = k.cost || 0, out = []
  const ctx = asObjs(d.ctx_buckets), over = ctx.filter(r => r.lo >= 200000).reduce((a, r) => a + r.cost, 0)
  if (total && over / total > .15) out.push(['warn', `<b>${pct(100 * over / total)}</b> of spend (${usd(over)}) came from requests above 200k context. Compacting or clearing earlier, and handing big reads to subagents, cuts this.`])
  const tools = asObjs(d.tools), bash = tools.find(t => t.tool === 'Bash'), allOut = tools.reduce((a, t) => a + (t.result_chars || 0), 0)
  if (bash && allOut) out.push(['', `Bash produced <b>${pct(100 * bash.result_chars / allOut)}</b> of all tool output (${big(bash.result_chars)} chars). See Tools → Bash commands for the heaviest ones.`])
  const whole = asObjs(d.read_ranges).find(r => r.kind === 'whole file')
  if (whole) out.push(['', `${big(whole.reads)} whole-file Reads returned ${big(whole.chars)} chars (avg ${big(whole.avg_chars)}). Ranged reads after a grep/LSP lookup return far less.`])
  const ew = Object.fromEntries(asObjs(d.edit_vs_write).map(r => [r.tool, r]))
  if (ew.Write && ew.Edit && ew.Write.input_chars > ew.Edit.input_chars) out.push(['warn', `Write sent ${big(ew.Write.input_chars)} chars vs Edit ${big(ew.Edit.input_chars)}: whole-file rewrites dominate. Edit the changed part instead.`])
  const par = asObjs(d.parallelism), reqs = par.reduce((a, r) => a + r.requests, 0), single = par.filter(r => r.tools_in_request === '1').reduce((a, r) => a + r.requests, 0)
  if (reqs && single / reqs > .6) out.push(['', `<b>${pct(100 * single / reqs)}</b> of requests made exactly one tool call. Independent reads in parallel would save whole round trips.`])
  if (total) out.push([k.hit_pct > 90 ? 'good' : 'warn', `Cache hit rate <b>${pct(k.hit_pct)}</b>; ${usd(k.subagent_cost)} (${pct(100 * (k.subagent_cost || 0) / total)}) spent inside subagents.`])
  const lsp = asObjs(d.search_vs_lsp).reduce((a, r) => [a[0] + r.lsp, a[1] + r.text_search], [0, 0])
  if (lsp[1]) out.push([lsp[0] ? 'good' : 'warn', `LSP calls: <b>${lsp[0]}</b> vs ${lsp[1]} grep/rg/find searches.`])
  el.innerHTML = out.map(([c, t]) => `<div class="insight ${c}">${t}</div>`).join('')
}

async function renderImpact(view) {
  view.insertAdjacentHTML('beforeend', `<p class="note" style="color:var(--muted)">Is each mod saving money or costing more? Every mod leaves a random share of sessions untouched (the <b>holdout</b>) and logs what it <i>would</i> have done there.
    <b>Verdict</b> compares cost per prompt in active vs holdout sessions, with a bootstrap 95% interval: a verdict appears only once the interval excludes zero.
    <b>Ledger</b> prices each mod's own actions (text it adds to every request, classifier calls, keep-alive pings) against what it kept out of context; it is an upper bound on savings, the holdout comparison is the real answer. Uses the days and profile filters.</p>`)
  $('#status').textContent = 'Loading…'
  let r
  try { r = await api('/api/impact') } catch (e) { $('#status').innerHTML = `<span class="err">${esc(e.message)}</span>`; return }
  const cls = { saving: 'good', costing: 'bad', collecting: '', unclear: 'warn' }
  const sign = v => v == null ? '–' : (v > 0 ? '+' : '') + (100 * v).toFixed(0) + '%'
  view.insertAdjacentHTML('beforeend', `<div class="insights">${r.mods.map(m => `<div class="insight ${cls[m.verdict[0]]}"><b>${esc(m.mod)}</b>: ${esc(m.verdict[1])}${m.costs.length || m.savings.length ? ` · ledger net <b>${usd(m.net)}</b>` : ''}</div>`).join('')}
    <div class="insight good"><b>usage-analytics</b>: ${esc(r.observer.note)}</div></div>`)
  for (const m of r.mods) {
    const grid = document.createElement('div'); grid.className = 'grid'; view.insertAdjacentHTML('beforeend', `<h2 style="margin:18px 0 6px;font-size:16px">${esc(m.mod)} <small style="color:var(--muted);font-weight:normal">holdout share ${m.holdoutShare == null ? '?' : (100 * m.holdoutShare).toFixed(0) + '%'}</small></h2>`); view.appendChild(grid)
    const add = (p, d) => { const el = panel(p); grid.appendChild(el); const b = el.querySelector('.body'); p.kind === 'table' ? table(b, d) : chart(b, p, d) }
    const fx = m.effects.map(e => [e.metric, e.on, e.holdout, sign(e.diff), e.lo == null ? '' : `${sign(e.lo)} … ${sign(e.hi)}`])
    add({ title: 'Active vs holdout sessions', note: `${m.arms.on?.sessions || 0} active · ${m.arms.holdout?.sessions || 0} holdout sessions` , kind: 'table' }, { cols: ['metric', 'active', 'holdout', 'diff', '95% interval'], rows: fx.map(([k, a, b, d, ci]) => [k, k.includes('cost') ? usd(a) : big(a), k.includes('cost') ? usd(b) : big(b), d, ci]) })
    add({ title: 'Ledger: saved vs own cost (active sessions)', kind: 'table' }, { cols: ['', 'item', 'usd', 'times'], rows: [...m.savings.map(x => ['+', ...x]), ...m.costs.map(x => ['−', ...x])] })
    if (m.compliance.length) add({ title: 'Nudges followed (vs would-have-been in holdout)', kind: 'table' }, { cols: ['nudge', 'arm', 'followed', 'total', 'followed_pct'], rows: m.compliance })
    add({ title: 'Actions', kind: 'table' }, { cols: ['kind', 'arm', 'n'], rows: m.actions })
    if (m.warnings.length) view.insertAdjacentHTML('beforeend', `<div class="insights">${m.warnings.map(w => `<div class="insight warn">${esc(w)}</div>`).join('')}</div>`)
  }
  const grid = document.createElement('div'); grid.className = 'grid'; view.appendChild(grid)
  const el = panel({ title: 'Mod actions per day', wide: true }); grid.appendChild(el)
  const objs = asObjs(r.daily), daily = { cols: ['day', 'mod', 'n'], rows: [] }, agg = {}
  objs.forEach(o => agg[o.day + '|' + o.mod] = (agg[o.day + '|' + o.mod] || 0) + o.n)
  Object.entries(agg).forEach(([k, n]) => daily.rows.push([...k.split('|'), n]))
  chart(el.querySelector('.body'), { kind: 'stacked', x: 'day', series: 'mod', y: 'n' }, daily)
  status()
}

async function renderSavings(view) {
  view.insertAdjacentHTML('beforeend', '<p class="note" style="color:var(--muted)">From budget-guard’s session ledgers (all time, not filtered): estimated dollars each lever avoided.</p>')
  const grid = document.createElement('div'); grid.className = 'grid'; view.appendChild(grid)
  const s = await (await fetch('/api/savings')).json()
  const add = (p, d) => { const el = panel(p); grid.appendChild(el); const b = el.querySelector('.body'); p.kind === 'table' ? table(b, d) : chart(b, p, d) }
  add({ title: 'Saved by lever', kind: 'hbar', x: 'lever', y: 'saved', money: true }, s.byLever)
  add({ title: 'Levers', kind: 'table' }, s.byLever)
  add({ title: 'Saved vs spent per day', kind: 'bar', x: 'day', y: ['spent', 'saved'], money: true, wide: true }, s.byDay)
  add({ title: 'By profile', kind: 'table' }, s.byProfile)
  status()
}

const EXAMPLES = {
  'Top 20 costliest requests': "SELECT ts, profile, model, context_tokens, output, ROUND(cost_usd, 3) cost, agent_type, session_id FROM v_requests ORDER BY cost_usd DESC LIMIT 20",
  'Spend per profile per week': "SELECT strftime('%Y-W%W', day) week, profile, ROUND(SUM(cost_usd), 2) cost FROM requests GROUP BY 1, 2 ORDER BY 1 DESC",
  'Biggest single tool results': "SELECT ts, tool, COALESCE(cmd, file) target, result_chars, session_id FROM tool_uses ORDER BY result_chars DESC LIMIT 30",
  'Schema': "SELECT type, name, sql FROM sqlite_master WHERE type IN ('table', 'view') ORDER BY type, name",
}
function renderSql(view) {
  view.insertAdjacentHTML('beforeend', `<section class="panel sql"><h3>SQL console</h3><p class="note">Read-only. Tables: requests, tool_uses, prompts, attachments, system_events, sessions, agents, events; views v_*. Ctrl/⌘+Enter runs.</p>
    <div class="row">${Object.keys(EXAMPLES).map(k => `<button data-ex="${esc(k)}">${esc(k)}</button>`).join('')}</div>
    <textarea id="sqlText">${esc(EXAMPLES['Top 20 costliest requests'])}</textarea>
    <div class="row"><button id="sqlRun">Run</button><span id="sqlInfo" class="note"></span></div><div id="sqlOut"></div></section>`)
  try { const s = localStorage.getItem('cu-sql'); if (s) $('#sqlText').value = s } catch {}
  const run = async () => {
    const sql = $('#sqlText').value; try { localStorage.setItem('cu-sql', sql) } catch {}
    const t = performance.now()
    const r = await fetch('/api/sql', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sql }) })
    const j = await r.json()
    if (!r.ok) { $('#sqlOut').innerHTML = `<div class="err">${esc(j.error)}</div>`; return }
    $('#sqlInfo').textContent = `${j.rows.length} rows · ${Math.round(performance.now() - t)} ms`
    table($('#sqlOut'), j, { long: j.cols })
  }
  $('#sqlRun').onclick = run
  $('#sqlText').onkeydown = e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') run() }
  view.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { $('#sqlText').value = EXAMPLES[b.dataset.ex]; run() })
  status()
}

async function openSession(sid) {
  $('#drawer').classList.add('open')
  const body = $('#drawerBody')
  body.innerHTML = '<div class="empty">Loading…</div>'
  const s = await (await fetch('/api/session?id=' + encodeURIComponent(sid))).json()
  const info = asObjs(s.info)[0] || {}
  const tl = asObjs(s.timeline)
  const cost = tl.reduce((a, r) => a + (r.cost || 0), 0)
  body.innerHTML = `<div class="row"><button id="close">✕ Close</button><h3 style="margin:0">${esc(info.title || sid)}</h3></div>
    <p class="note" style="color:var(--muted)">${esc(sid)} · ${esc(info.profile || '')} · ${esc(info.project || '')} · ${esc(info.git_branch || '')} · ${tl.length} requests · ${usd(cost)} list price${info.cc_cost_usd ? ` · Claude Code said ${usd(info.cc_cost_usd)}` : ''}</p>
    <div class="grid"></div>`
  $('#close').onclick = () => $('#drawer').classList.remove('open')
  const grid = body.querySelector('.grid')
  const add = (p, d) => { const el = panel(p); grid.appendChild(el); const b = el.querySelector('.body'); p.kind === 'table' ? table(b, d) : chart(b, p, d) }
  let run = 0
  const ctx = { cols: ['n', 'context', 'cumulative_cost'], rows: tl.map((r, i) => [i + 1, r.agent === 'main' ? r.context : null, (run += r.cost || 0)]) }
  add({ title: 'Main-loop context and cumulative cost per request', kind: 'line', x: 'n', y: ['context', 'cumulative_cost'], y2: ['cumulative_cost'], wide: true }, ctx)
  const byAgent = {}; tl.forEach(r => { byAgent[r.agent] = (byAgent[r.agent] || 0) + (r.cost || 0) })
  add({ title: 'Cost by agent', kind: 'doughnut', x: 'agent', y: 'cost', money: true }, { cols: ['agent', 'cost'], rows: Object.entries(byAgent) })
  const byTool = {}; asObjs(s.tools).forEach(t => { byTool[t.tool] = (byTool[t.tool] || 0) + (t.result_chars || 0) })
  add({ title: 'Tool output by tool', kind: 'hbar', x: 'tool', y: 'chars' }, { cols: ['tool', 'chars'], rows: Object.entries(byTool).sort((a, b) => b[1] - a[1]).slice(0, 12) })
  add({ title: 'Prompts', kind: 'table', wide: true }, s.prompts)
  add({ title: 'Tool calls', kind: 'table', wide: true }, s.tools)
  add({ title: 'Subagents', kind: 'table' }, s.agents)
  add({ title: 'Requests', kind: 'table', wide: true }, s.timeline)
}
$('#drawer').onclick = e => { if (e.target.id === 'drawer') $('#drawer').classList.remove('open') }
document.onkeydown = e => { if (e.key === 'Escape') $('#drawer').classList.remove('open') }

function status() {
  const m = state.meta
  $('#status').textContent = m ? `${m.range[0]} → ${m.range[1]} · last ingest ${m.lastIngest ? new Date(m.lastIngest).toLocaleString() : 'never'} · ${big(m.modEvents)} mod events` : ''
}

async function loadMeta() {
  state.meta = await (await fetch('/api/meta')).json()
  $('#profiles').innerHTML = state.meta.profiles.map(p => `<span class="chip ${state.profiles.has(p) ? 'on' : ''}" data-p="${esc(p)}">${esc(p.replace(/^claude-/, ''))}</span>`).join('')
  $('#profiles').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.profiles.has(c.dataset.p) ? state.profiles.delete(c.dataset.p) : state.profiles.add(c.dataset.p)
    c.classList.toggle('on'); render()
  })
  const cur = $('#model').value
  $('#model').innerHTML = '<option value="">All models</option>' + state.meta.models.map(m => `<option ${m === cur ? 'selected' : ''}>${esc(m)}</option>`).join('')
}

$('#tabs').innerHTML = Object.entries(TABS).map(([k, t]) => `<a data-t="${k}">${t.label}</a>`).join('')
$('#tabs').querySelectorAll('a').forEach(a => a.onclick = () => { state.tab = a.dataset.t; try { localStorage.setItem('cu-tab', state.tab) } catch {}; history.replaceState(null, '', '#' + state.tab); render() })
$('#days').onchange = $('#model').onchange = render
$('#refresh').onclick = () => loadMeta().then(render)
let t; $('#project').oninput = () => { clearTimeout(t); t = setTimeout(render, 400) }
$('#ingest').onclick = async () => {
  $('#ingest').disabled = true; $('#status').textContent = 'Ingesting…'
  const r = await (await fetch('/api/ingest', { method: 'POST' })).json()
  $('#ingest').disabled = false
  await loadMeta(); render()
  if (r.seconds != null) $('#status').textContent += ` · ingest took ${r.seconds}s`
}
if (!TABS[state.tab]) state.tab = 'overview'
loadMeta().then(render)
</script>
