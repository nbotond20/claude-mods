<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Usage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c96442'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f5f5f2; --panel: #ffffff; --panel2: #fafaf8; --ink: #1c1c1a; --muted: #6d6c66; --faint: #9a9993; --line: #e6e5df; --line2: #efeee9;
  --accent: #c96442; --accent-ink: #ffffff; --good: #2f7d4f; --warn: #b7791f; --bad: #b83a3a; --hover: #f1f0eb; --bar: rgba(201, 100, 66, .13);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03); --shadow-lg: 0 18px 50px rgba(0,0,0,.18);
  --s1: #c96442; --s2: #3d6fb6; --s3: #2f7d4f; --s4: #8a5cb8; --s5: #b7791f; --s6: #4a9fa8; --s7: #b8457a; --s8: #7a7a70;
  --s9: #5f8f2f; --s10: #c2a23a; --s11: #4a5fa8; --s12: #a8634a;
  --side: 216px; --radius: 10px; --r-sm: 6px;
  /* one type scale and one spacing scale for every view */
  --fs-xs: 11px; --fs-s: 12px; --fs: 13px; --fs-l: 15px;
  --gap: 12px; --gap-l: 24px;
  --mono: ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141413; --panel: #1d1d1b; --panel2: #191917; --ink: #ecebe6; --muted: #a3a29b; --faint: #75746e; --line: #302f2b; --line2: #262523;
  --accent: #e08a68; --accent-ink: #1a1a18; --good: #5bb07f; --warn: #d9a54a; --bad: #e06b6b; --hover: #262624; --bar: rgba(224, 138, 104, .16);
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
  --s1: #e08a68; --s2: #6f9be0; --s3: #5bb07f; --s4: #b08ae0; --s5: #d9a54a; --s6: #6cc3cc; --s7: #e07aa8; --s8: #a8a89e; --s9: #9ccc65; --s10: #e6cf6a; --s11: #8f9cf0; --s12: #d49a80;
} }
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --panel2: #191917; --ink: #ecebe6; --muted: #a3a29b; --faint: #75746e; --line: #302f2b; --line2: #262523;
  --accent: #e08a68; --accent-ink: #1a1a18; --good: #5bb07f; --warn: #d9a54a; --bad: #e06b6b; --hover: #262624; --bar: rgba(224, 138, 104, .16);
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
  --s1: #e08a68; --s2: #6f9be0; --s3: #5bb07f; --s4: #b08ae0; --s5: #d9a54a; --s6: #6cc3cc; --s7: #e07aa8; --s8: #a8a89e; --s9: #9ccc65; --s10: #e6cf6a; --s11: #8f9cf0; --s12: #d49a80;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: var(--fs)/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing: antialiased; }
body.noscroll { overflow: hidden; }
a { color: var(--accent); }
select, input, button, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -1px; }
button { cursor: pointer; transition: background .15s, border-color .15s; }
button:hover { background: var(--hover); }
button:disabled { opacity: .55; cursor: default; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--panel2); }
code { font-family: var(--mono); font-size: var(--fs-s); }
.muted { color: var(--muted); }
/* Small uppercase label above a value or a block (tiles, fields, detail headings). */
.eyebrow, .rfields dt, .rc-detail h5 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
aside { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--panel2); display: flex; flex-direction: column; padding: 14px 10px; gap: 6px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 10px; font-weight: 650; font-size: var(--fs-l); }
.brand .logo { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.brand span { color: var(--accent); }
.search { display: flex; align-items: center; justify-content: space-between; color: var(--muted); border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 9px; cursor: pointer; margin: 0 2px 6px; font-size: var(--fs-s); }
.search:hover { border-color: var(--faint); }
nav { flex: 1; overflow: auto; }
nav .group { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); padding: 12px 10px 4px; font-weight: 600; }
nav a { display: flex; align-items: center; gap: 9px; padding: 6px 10px; margin: 1px 0; border-radius: 7px; cursor: pointer; color: var(--muted); text-decoration: none; user-select: none; transition: background .12s, color .12s; }
nav a svg { width: 15px; height: 15px; flex: none; opacity: .85; }
nav a:hover { background: var(--hover); color: var(--ink); }
nav a.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), var(--shadow); font-weight: 550; }
nav a.on svg { color: var(--accent); opacity: 1; }
nav a .badge { margin-left: auto; font-size: 10px; color: var(--accent); font-weight: 600; }
.sidefoot { border-top: 1px solid var(--line); padding: 10px 8px 0; display: grid; gap: 8px; font-size: var(--fs-s); color: var(--muted); }
.live { display: flex; align-items: center; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.live.on .dot { background: var(--good); box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); animation: breathe 2.4s infinite; }
.live.flash .dot { animation: ping .9s ease-out; }
.live.off .dot { background: var(--bad); }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); } 50% { box-shadow: 0 0 0 4px transparent; } }
@keyframes ping { 0% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 70%, transparent); } 60% { transform: scale(1.35); box-shadow: 0 0 0 8px transparent; } 100% { transform: scale(1); } }
.sidefoot .row2 { display: flex; gap: 6px; }
.sidefoot button { flex: 1; font-size: var(--fs-s); padding: 4px 6px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); padding: 10px 24px; }
.titlerow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 28px; }
.titlerow h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.titlerow .sub { color: var(--muted); font-size: var(--fs-s); }
.status { margin-left: auto; color: var(--faint); font-size: var(--fs-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.iconbtn { flex: none; width: 28px; height: 28px; padding: 0; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { color: var(--ink); }
.iconbtn svg { width: 15px; height: 15px; }
.iconbtn.spin svg { animation: spin .7s linear; }
@keyframes spin { to { transform: rotate(360deg); } }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 9px; }
/* Segmented control: periods, chart/table, list filters. */
.seg { display: inline-flex; align-items: center; height: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; flex: none; }
.seg button { border: 0; background: transparent; height: 22px; padding: 0 9px; border-radius: 6px; color: var(--muted); font-size: var(--fs-s); }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--ink); color: var(--bg); }
.seg button .n { margin-left: 5px; opacity: .65; font-variant-numeric: tabular-nums; }
.seg.sm { height: 24px; } .seg.sm button { height: 18px; padding: 0 7px; font-size: var(--fs-xs); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; user-select: none; color: var(--muted); font-size: var(--fs-s); transition: all .12s; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.chip.on { color: var(--ink); border-color: var(--ink); }
.toggle { display: inline-flex; height: 28px; padding: 0 2px; gap: 6px; align-items: center; color: var(--muted); font-size: var(--fs-s); cursor: pointer; user-select: none; }
.toggle input { margin: 0; accent-color: var(--accent); }
.filters .grow { flex: 1; }
.filters select, .filters input { font-size: var(--fs-s); padding: 4px 8px; height: 28px; }
.filters select { max-width: 150px; }
.filters #project { width: 130px; }
.btn { font-size: var(--fs-s); padding: 4px 11px; height: 28px; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--ink) 85%, var(--bg)); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.sm { font-size: var(--fs-xs); padding: 3px 8px; height: 24px; }

.content { padding: 20px 24px 72px; max-width: 1640px; width: 100%; }
.topbar.nofilters .filters { display: none; }

/* "About this view": one line visible, the method behind a toggle. */
.about { margin: 0 0 var(--gap-l); color: var(--muted); font-size: var(--fs-s); max-width: 980px; }
.about summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; user-select: none; }
.about summary::-webkit-details-marker { display: none; }
.about summary > span:first-child { color: var(--ink); font-size: var(--fs); }
.about summary .how { color: var(--accent); white-space: nowrap; flex: none; }
.about summary .how::after { content: " ▸"; font-size: 10px; }
.about[open] summary .how::after { content: " ▾"; }
.about .body { margin-top: 10px; padding: 10px 14px; border-left: 2px solid var(--line); display: grid; gap: 6px; }
.about .body p { margin: 0; }
.about b { color: var(--ink); font-weight: 600; }

/* ---------- tiles (KPIs and every stat block) ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); margin-bottom: var(--gap-l); }
.kpis.auto { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); }
.kpi { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 10px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
.kpi > small { color: var(--muted); font-size: var(--fs-s); font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi > b { display: block; font-size: 22px; line-height: 1.2; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 3px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .4s; }
.kpi > b .unit { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 1px; }
.kpi > b.bump { color: var(--accent); }
.kpi .delta { font-size: var(--fs-xs); line-height: 16px; min-height: 16px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .delta .vs { color: var(--faint); }
.delta .good, .delta.good { color: var(--good); } .delta .bad, .delta.bad { color: var(--bad); }
.kpi .sparkw { position: relative; margin-top: auto; border-top: 8px solid transparent; cursor: crosshair; }
.kpi svg.spark { display: block; width: 100%; height: 26px; overflow: visible; }
.sparkw .sline, .sparkw .sdot { position: absolute; opacity: 0; pointer-events: none; transition: opacity .1s; }
.sparkw .sline { top: 0; bottom: 0; width: 1px; margin-left: -.5px; background: var(--faint); }
.sparkw .sdot { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--panel); border: 2px solid; box-sizing: border-box; }
.sparkw.hot .sline { opacity: .7; } .sparkw.hot .sdot { opacity: 1; }
.kpi .nospark { margin-top: auto; }
.kpi.hero { grid-column: span 2; }
.kpi.hero > b { font-size: 30px; }
.kpi.hero svg.spark { height: 34px; }
.kpis.flat .kpi.hero { grid-column: auto; }
.kpi .meter { margin-top: auto; }
/* Compact tiles inside cards and drawers: no shadow, tighter. */
.kpis.compact { gap: 0; margin: 0; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); border: 1px solid var(--line2); border-radius: 8px; background: var(--panel2); overflow: hidden; }
.kpis.compact .kpi { border: 0; border-left: 1px solid var(--line2); border-radius: 0; box-shadow: none; background: transparent; padding: 8px 12px; }
.kpis.compact .kpi:first-child { border-left: 0; }
.kpis.compact .kpi > b { font-size: 16px; margin: 1px 0 0; }
.kpis.compact .kpi > b.warn { color: var(--warn); font-size: 14px; } .kpis.compact .kpi > b.bad { color: var(--bad); }
.kpis.compact .kpi > small { font-size: var(--fs-xs); }
.meter { height: 5px; background: var(--line2); border-radius: 9px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 9px; transition: width .5s; }
.meter > i.hot { background: var(--bad); } .meter > i.warm { background: var(--warn); }
#tip { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; opacity: 0; transition: opacity .08s; background: var(--ink); color: var(--bg); font-size: 11.5px; line-height: 1.45; font-variant-numeric: tabular-nums; padding: 6px 9px; border-radius: 7px; white-space: pre-line; max-width: 300px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
#tip.on { opacity: 1; }
#tip::first-line { font-weight: 600; }
.heat div[data-tip]:hover { outline: 2px solid var(--ink); outline-offset: -1px; }
.info { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--line); color: var(--faint); font-size: 10px; line-height: 1; font-weight: 700; font-style: normal; cursor: help; vertical-align: 2px; box-sizing: border-box; margin-left: 4px; }
.info:hover { color: var(--ink); border-color: var(--faint); }

/* ---------- sections and panels ---------- */
h2.sec { margin: var(--gap-l) 0 var(--gap); font-size: var(--fs-l); font-weight: 640; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h2.sec:first-child { margin-top: 0; }
h2.sec small { color: var(--muted); font-weight: normal; font-size: var(--fs-s); }
h2.sec .seg { margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)); gap: var(--gap); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 14px 12px; min-width: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.panel.wide { grid-column: 1 / -1; }
.panel > .body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.panel > header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; min-height: 24px; }
.panel > header > div:first-child { flex: 1; min-width: 0; }
.panel h3 { margin: 0; font-size: var(--fs); font-weight: 620; line-height: 24px; }
.panel p.note { margin: 0; color: var(--muted); font-size: var(--fs-s); }
.acts { display: flex; gap: 4px; align-items: center; }
.acts .ib { border: 0; background: transparent; width: 24px; height: 24px; padding: 0; color: var(--faint); border-radius: 5px; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.panel:hover .acts .ib, .panel.max .acts .ib, .acts .ib:focus-visible { opacity: 1; }
.acts .ib:hover { background: var(--hover); color: var(--ink); }
.acts .ib svg { width: 14px; height: 14px; }
.acts input { width: 120px; font-size: var(--fs-s); padding: 2px 7px; height: 24px; }
.panel.max { position: fixed; inset: 18px; z-index: 30; box-shadow: var(--shadow-lg); overflow: auto; }
.panel.max .chart { height: calc(100vh - 120px) !important; }
.panel.max .tbl { max-height: calc(100vh - 110px); }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 25; display: none; }
.scrim.on { display: block; }
.chart { position: relative; height: 280px; }
.chart.tall { height: 400px; }
.chart.short { height: 200px; }

/* ---------- tables: one look everywhere ---------- */
.tbl { overflow: auto; max-height: 560px; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-s); }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line2); text-align: left; white-space: nowrap; }
td { position: relative; }
th { position: sticky; top: 0; z-index: 2; background: var(--panel); color: var(--muted); font-weight: 600; font-size: var(--fs-xs); border-bottom: 1px solid var(--line); user-select: none; }
th[data-i], th[data-k] { cursor: pointer; }
th[data-i]:hover, th[data-k]:hover { color: var(--ink); }
th .arrow { color: var(--accent); margin-left: 3px; font-size: 9px; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { padding-left: 2px; }
th:last-child, td:last-child { padding-right: 2px; }
td .b { position: absolute; right: 8px; bottom: 3px; height: 3px; background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 2px; pointer-events: none; }
td:last-child .b { right: 2px; }
td.num > span.v { position: relative; }
td.path, td.txt { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.panel.wide td.path, .panel.wide td.txt { max-width: 300px; }
.panel.max td.path, .panel.max td.txt { max-width: 480px; }
td.long { white-space: normal; min-width: 240px; max-width: 560px; }
/* Long text reads as two lines in the table; the whole text is in the tooltip and the CSV. */
td.long .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.panel.max td.long .clamp, .sql td.long .clamp { -webkit-line-clamp: 6; }
td a { cursor: pointer; text-decoration: none; font-family: var(--mono); font-size: 11.5px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .1s; }
tbody tr:hover td { background: var(--hover); }
tr.new td { animation: flash 2.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
.more { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: var(--fs-xs); padding: 8px 2px 0; margin-top: auto; border-top: 1px solid var(--line2); font-variant-numeric: tabular-nums; }
.more .btn { margin-left: auto; color: var(--accent); }
.more .btn:hover { color: var(--accent); }
.tfilter[hidden] { display: none; }
.more a { color: var(--accent); cursor: pointer; }
.more a:hover { text-decoration: underline; }
.gauge { display: inline-flex; align-items: center; gap: 7px; }
.gauge .meter { width: 70px; margin: 0; }
/* Tables inside cards (evidence, per project) get a frame instead of a panel. */
.minitbl { overflow-x: auto; margin-top: 6px; border: 1px solid var(--line2); border-radius: var(--r-sm); }
table.mini th, table.mini td { padding: 4px 9px; }
table.mini th { position: static; }

/* ---------- tags: one pill for status, grade, verdict ---------- */
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-size: var(--fs-xs); font-weight: 600; color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.tag.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.tag.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
.tag.plain { font-weight: 500; background: var(--panel2); border-color: var(--line2); }

/** A timestamp as local "2026-10-15 14:20": epoch ms, or ISO (UTC when it says so, else as written). */
const TS_COL = /^(ts|started|finished|status_at|checked|last_ts|first_ts)$/
const fmtTs = v => {
  const d = typeof v === 'number' ? new Date(v > 1e11 ? v : v * 1000) : /(Z|[+-]\d\d:?\d\d)$/.test(v) ? new Date(v) : null
  if (d && !isNaN(d)) return `${ymd(d)} ${hhmm24(d)}`
  return String(v).replace('T', ' ').slice(0, 16)
}
const fmtCell = (col, v) => {
  if (v == null) return ''
  if (TS_COL.test(col) && (typeof v === 'number' ? v > 1e9 : /^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(v))) return fmtTs(v)
  if (col === 'signals') { try { return JSON.parse(v).map(human).join(' · ') } catch { return String(v) } }
  if (typeof v !== 'number') return col === 'tool' ? prettyTool(v) : /^models?$/.test(col) ? String(v).split(/,\s*/).map(shortModel).join(', ') : String(v)
  if (/cost|saved|spent|usd/.test(col)) return usd(v)
  if (/pct|share/.test(col)) return pct(v)
  if (/^(hour|weekday|spawn_depth|is_error|deferred)$/.test(col)) return String(v)
  if (col === 'minutes') return v < 60 ? Math.round(v) + 'm' : v < 1440 ? `${Math.floor(v / 60)}h ${Math.round(v % 60)}m` : (v / 60).toFixed(0) + 'h'
  return big(v)
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x }
const ago = ts => { if (!ts) return '–'; const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000)
  return s < 60 ? Math.round(s) + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? (s / 3600).toFixed(1) + 'h ago' : Math.round(s / 86400) + 'd ago' }
const hhmm = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
const hhmm24 = d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
const shortModel = m => String(m || '').replace(/^claude-/, '').replace(/-\d{8}$/, '')
/** Column and series names as people read them: cache_read → cache read, hit_pct → cache hit %. */
const HEADS = { pct: '%', usd: '$', ctx: 'context', avg_s: 'avg seconds', max_s: 'max seconds', n: 'count', cost_per_1k_req: 'cost per 1k requests', hit_pct: 'cache hit %', subagent_pct: 'subagent share %', followed_pct: 'followed %', is_error: 'error' }
const human = c => HEADS[c] ?? String(c).replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase().replace(/_pct$/, ' %').replace(/_+$/, '').replace(/_/g, ' ')
/** mcp__plugin_x_server__tool → server · tool */
const prettyTool = t => { const m = /^mcp__(.+?)__(.+)$/.exec(String(t)); if (!m) return String(t)
  return `${m[1].replace(/^plugin_[^_]+_/, '').replace(/^claude_ai_/, '').replace(/_/g, ' ')} · ${m[2]}` }
const shortPath = (p, n = 38) => { p = String(p); return p.length <= n ? p : '…' + p.slice(-(n - 1)).replace(/^[^/]*\//, '/') }

/** A stat tile: label, value, one line under it (a delta or a short fact), optional sparkline or extra html. */
const tile = ({ label, value, sub = '', cls = '', title = '', vcls = '', extra = '' }) =>
  `<div class="kpi ${cls}"${title ? ` title="${esc(title)}"` : ''}><small>${esc(label)}</small><b class="${vcls}">${value}</b>${sub.startsWith('<span class="delta') ? sub : `<span class="delta">${sub || '&nbsp;'}</span>`}${extra || '<div class="nospark"></div>'}</div>`
/** A pill for a status, grade or verdict. tone: good | warn | bad | accent | plain. */
const tag = (text, tone = '', title = '') => `<span class="tag ${tone}"${title ? ` title="${esc(title)}"` : ''}>${text}</span>`

const info = text => text ? `<i class="info" data-tip="${esc(text)}">i</i>` : ''
/** A view's explanation: one line always visible, the method behind "How it works". */
const about = (lead, ...paras) => `<details class="about"><summary><span>${lead}</span>${paras.length ? '<span class="how">How it works</span>' : ''}</summary>${paras.length ? `<div class="body">${paras.map(p => `<p>${p}</p>`).join('')}</div>` : ''}</details>`
/** A list of notes with a tone dot: insights, findings, verdicts, warnings. Items are [tone, html]. */
const notes = (items, head = '', sub = '') => `<div class="insights">${head ? `<div class="insights-head"><h3>${head}</h3>${sub ? `<small>${sub}</small>` : ''}</div>` : ''}${items.map(([c, t]) => `<div class="insight ${c}"><span>${t}</span></div>`).join('')}</div>`

/** One change format everywhere: "+12%" coloured by whether it is good, then "vs …". sense: -1 lower is better, 1 higher is better, 0 neutral. */
const deltaSpan = (rel, sense, vs = '', title = '') => {
  if (rel == null) return `<span class="delta">${vs ? `<span class="vs">${vs}</span>` : '&nbsp;'}</span>`
  const tone = Math.abs(rel) < .02 || !sense ? '' : (rel > 0) === (sense > 0) ? 'good' : 'bad'
  return `<span class="delta"${title ? ` title="${esc(title)}"` : ''}><span class="${tone}">${chg(rel)}</span>${vs ? ` <span class="vs">${vs}</span>` : ''}</span>`
}

// ---------- data ----------
function params(extra = {}) {
  const p = new URLSearchParams({ days: state.days })
  if (state.profiles.size) p.set('profile', [...state.profiles].join(','))
  if ($('#model').value) p.set('model', $('#model').value)
  if ($('#project').value.trim()) p.set('project', $('#project').value.trim())
  for (const [k, v] of Object.entries(extra)) p.set(k, v)
  return p
}
async function api(path, extra) {
  const r = await fetch(path + (path.includes('?') ? '&' : '?') + params(extra))
  const j = await r.json()
  if (!r.ok) throw new Error(j.error || r.status)
  return j
}
const asObjs = d => d.rows.map(r => Object.fromEntries(d.cols.map((c, i) => [c, r[i]])))
/** The period before the current one, same length (null for all time). */
function prevRange() {
  const n = +state.days
  if (!n) return null
  // No comparison when the data does not cover the whole previous period (it would read as a huge jump).
  const today = new Date(), curFrom = addDays(today, -(n - 1)), to = addDays(curFrom, -1)
  const from = ymd(addDays(to, -(n - 1)))
  if (state.meta && state.meta.range[0] > from) return null
  return { from, to: ymd(to) }
}

// ---------- colors ----------
// Profiles take the palette in order (the same colour on every chart); well-known series keep one meaning everywhere.
const colorIdx = new Map()
const FIXED = [[/^(main|main_cost|main loop)$/i, 1], [/^subagent(_cost|s)?$/i, 2], [/^opus$/i, 4], [/^sonnet$/i, 6], [/^haiku$/i, 5], [/^fable$/i, 7],
  [/^cache.?read/i, 6], [/^cache.?write/i, 4], [/^input/i, 5], [/^output/i, 1], [/^(other|–)$/i, 8], [/^(lsp)$/i, 3], [/^text.?search$/i, 8],
  [/^saved$/i, 3], [/^spent$/i, 1], [/^prompts$/i, 1], [/^commands$/i, 2], [/^agent.?prompts$/i, 4],
  [/^mild$/i, 10], [/^annoyed$/i, 5], [/^frustrated$/i, 1], [/^rage$/i, 7]]
function colorFor(label) {
  const pal = PALETTE(), isProfile = state.meta?.profiles?.includes(label)
  if (!isProfile && !colorIdx.has(label)) { const f = FIXED.find(([re]) => re.test(String(label))); if (f) return pal[f[1] - 1] }
  if (!colorIdx.has(label)) colorIdx.set(label, colorIdx.size % 12)
  return pal[colorIdx.get(label)]
}

Chart.defaults.font.family = getComputedStyle(document.body).fontFamily
Chart.defaults.font.size = 11
Chart.defaults.animation.duration = 380
/** What the pointer is on: the series under it (bars: the segment, lines: the nearest line) and a band at the hovered
 *  column, so a stacked or multi-line chart says which value is which. Hovering a legend entry dims the other series. */
Chart.register({
  id: 'hoverAid',
  afterEvent(ch, args) {
    const e = args.event, type = ch.config.type
    if (type === 'doughnut') return
    let hov = null
    if (e.type === 'mousemove') {
      const line = type === 'line'
      const hit = ch.getElementsAtEventForMode(e, line ? 'nearest' : 'point', line ? { intersect: false, axis: 'xy' } : { intersect: true }, false)[0]
      hov = hit ? hit.datasetIndex : null
    }
    if (hov !== ch.$hov) { ch.$hov = hov; args.changed = true }
  },
  beforeDatasetsDraw(ch) {
    const type = ch.config.type, act = ch.tooltip?.getActiveElements?.() || []
    if (!act.length || type === 'doughnut' || type === 'scatter') return
    const { ctx, chartArea: a } = ch, el = act[0].element, hbar = ch.options.indexAxis === 'y'
    ctx.save()
    if (type === 'bar') {
      const size = (hbar ? el.height : el.width) || 0, n = ch.data.labels.length || 1
      const slot = Math.max(size + 8, ((hbar ? a.bottom - a.top : a.right - a.left) / n) * .9)

      if (hbar) ctx.fillRect(a.left, el.y - slot / 2, a.right - a.left, slot)
      else ctx.fillRect(el.x - slot / 2, a.top, slot, a.bottom - a.top)
    } else {
      ctx.strokeStyle = css('--faint'); ctx.lineWidth = 1; ctx.setLineDash([3, 3])
      ctx.beginPath(); ctx.moveTo(Math.round(el.x) + .5, a.top); ctx.lineTo(Math.round(el.x) + .5, a.bottom); ctx.stroke()
    }
    ctx.restore()
  },
  beforeDatasetDraw(ch, args) {
    const f = ch.$legendHov ?? (ch.config.type === 'line' && ch.data.datasets.length > 1 && !ch.data.datasets.some(d => d.fill) ? ch.$hov : null)
    if (f != null && args.index !== f) { ch.ctx.save(); ch.ctx.globalAlpha = .22; ch.$dimmed = true }
  },
  afterDatasetDraw(ch) { if (ch.$dimmed) { ch.ctx.restore(); ch.$dimmed = false } },
})

Chart.Tooltip.positioners.cursor = (items, pos) => items.length ? { x: pos.x, y: pos.y } : false
/** A project as its last two folders, the same in legends, axes and tooltips. */
const projectLabel = v => { const parts = String(v).split('/').filter(Boolean); return parts.length > 2 ? '…/' + parts.slice(-2).join('/') : String(v) }

  onHover(e, item, legend) {

  },
  onLeave(e, item, legend) {

    ch.$legendHov = null

const TIP = () => ({ backgroundColor: css('--ink'), titleColor: css('--bg'), bodyColor: css('--bg'), footerColor: css('--bg'), padding: 10, cornerRadius: 7, boxPadding: 4, caretPadding: 8,

/** Long rows (x, series, y) -> one dataset per series. */
function pivot(objs, x, s, y) {
  const xs = [...new Set(objs.map(o => o[x]))]
  const totals = {}
  objs.forEach(o => totals[o[s]] = (totals[o[s]] || 0) + (o[y] || 0))
  const ss = Object.keys(totals).sort((a, b) => totals[b] - totals[a])
  const idx = Object.fromEntries(xs.map((v, i) => [v, i]))
  const data = Object.fromEntries(ss.map(k => [k, xs.map(() => 0)]))
  objs.forEach(o => data[o[s]][idx[o[x]]] += o[y] || 0)
  return { labels: xs, series: ss.map(k => ({ label: k, data: data[k] })) }
}

// Paths keep their tail (the project name), everything else its head.
const trunc = (s, n) => { s = String(s); return s.length <= n ? s : /^[~\/]/.test(s) ? '…' + s.slice(-(n - 1)) : s.slice(0, n - 1) + '…' }

    y: { stacked, grid: { color: grid }, border: { display: false }, ticks: { color: tick, callback: p.kind === 'hbar' ? function (v) { return trunc(this.getLabelForValue(v), 34) } : v => (p.money ? usdAxis : fmtY)(v) }, beginAtZero: true },

    responsive: true, maintainAspectRatio: false, indexAxis: p.kind === 'hbar' ? 'y' : 'x', cutout: type === 'doughnut' ? '62%' : undefined,
    interaction: { mode: type === 'doughnut' ? 'nearest' : 'index', intersect: false },
    plugins: {

        ...(type === 'doughnut' ? { generateLabels: ch => { const sum = ch.data.datasets[0].data.reduce((a, b) => a + (+b || 0), 0)
          return Chart.overrides.doughnut.plugins.legend.labels.generateLabels(ch).map((l, i) => ({ ...l, text: `${l.text}  ${sum ? Math.round(100 * ch.data.datasets[0].data[i] / sum) : 0}%` })) } } : {}) } },
      // The series under the pointer comes first and in full colour; at most 8 rows, the rest summed in the footer.
      tooltip: { ...TIP(), position: type === 'doughnut' ? 'nearest' : 'cursor', yAlign: type === 'doughnut' ? undefined : 'center',

        },

          labelTextColor: c => c.chart.$hov == null || c.chart.$hov === c.datasetIndex || c.chart.config.type === 'doughnut' ? css('--bg') : css('--bg') + 'b3',
          footer: items => {

    },

  } }
}

/** A panel: spec, DOM, and what it currently shows. Charts are updated in place when new data arrives. */
function makePanel(p, grid, list = state.panels) {
  const el = document.createElement('section')
  el.className = 'panel fade' + (p.wide ? ' wide' : '')
  const chartable = p.kind !== 'table' && p.kind !== 'heatmap'
  // Title, then at most one short line; anything longer sits behind the ⓘ. Charts get a visible Chart | Table switch.
  const topNote = p.top ? `top ${p.top}; Table lists all` : ''
  el.innerHTML = `<header><div><h3>${esc(p.title)}${info([p.info, topNote].filter(Boolean).join('\n'))}</h3>${p.note ? `<p class="note">${p.note}</p>` : ''}</div><div class="acts">
    ${p.kind === 'table' ? '<input class="tfilter" placeholder="Filter…" hidden>' : ''}
    <button class="ib" data-a="csv" title="Download CSV">${ICON.csv}</button><button class="ib" data-a="max" title="Expand (esc closes)">${ICON.max}</button>
    ${chartable ? '<div class="seg sm"><button data-v="chart" class="on">Chart</button><button data-v="table">Table</button></div>' : ''}</div></header>
    <div class="body"><div class="skel ${p.kind === 'table' ? 's' : ''}"></div></div>`
  grid.appendChild(el)
  const P = { p, el, body: el.querySelector('.body'), chart: null, data: null, view: p.kind === 'table' ? 'table' : 'chart', sort: { col: -1, asc: false }, filter: '' }
  el.querySelector('[data-a="max"]').onclick = () => toggleMax(P)
  el.querySelector('[data-a="csv"]').onclick = () => P.data && csv(p.title, P.data)
  el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    if (P.view === b.dataset.v) return
    P.view = b.dataset.v; el.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b)); fill(P, P.data)
  })
  const f = el.querySelector('.tfilter')
  if (f) f.oninput = () => { P.filter = f.value.toLowerCase(); drawTable(P) }
  list.push(P)
  return P
}
function destroyChart(P) { if (P.chart) { P.chart.destroy(); P.chart = null } }
function fill(P, d, opts) {
  // The page is read from disk on every load, the queries when the server started: a newer page on an older server.
  if (!d) { P.body.innerHTML = '<div class="err">The dashboard server is older than this page and has no query for this panel. Run /dashboard to restart it.</div>'; return }
  P.data = d
  if (P.p.kind === 'heatmap') { destroyChart(P); return heatmap(P.body, d, P.p) }
  if (P.view === 'table') return drawTable(P, opts)
  drawChart(P)
}
function drawChart(P) {
  const d = P.p.top ? { cols: P.data.cols, rows: P.data.rows.slice(0, P.p.top) } : P.data
  if (!d.rows.length) { destroyChart(P); P.body.innerHTML = '<div class="empty">No data for this filter</div>'; return }
  const cfg = chartConfig(P.p, d)
  const c = P.chart
  if (c && c.config.type === cfg.type && P.body.contains(c.canvas)) {
    const old = Object.fromEntries(c.data.datasets.map(ds => [ds.label, ds]))
    c.data.labels = cfg.data.labels
    c.data.datasets = cfg.data.datasets.map(ds => old[ds.label] ? Object.assign(old[ds.label], { data: ds.data, backgroundColor: ds.backgroundColor }) : ds)
    c.update()
    return
  }
  destroyChart(P)
  P.body.innerHTML = `<div class="chart ${P.p.tall ? 'tall' : P.p.short ? 'short' : ''}"><canvas></canvas></div>`
  P.chart = new Chart(P.body.querySelector('canvas'), cfg)
}
function drawTable(P, opts = P.opts || {}) {
  P.opts = opts
  destroyChart(P)
  const d = P.data, el = P.body
  if (!d) return
  if (!d.rows.length) { el.innerHTML = '<div class="empty">No data for this filter</div>'; return }
  const long = new Set(opts.long || P.p.long || ['text', 'prompt', 'description', 'title', 'error', 'target', 'section', 'summary', 'finding'])
  let rows = d.rows
  if (P.filter) rows = rows.filter(r => r.some(v => v != null && String(v).toLowerCase().includes(P.filter)))
  const { col, asc } = P.sort
  if (col >= 0) rows = rows.slice().sort((a, b) => { const x = a[col] ?? -Infinity, y = b[col] ?? -Infinity; return x > y ? (asc ? 1 : -1) : x < y ? (asc ? -1 : 1) : 0 })
  // Panels show the first rows; "Show all" opens the rest in a scroll box, Expand shows everything with every column.
  const max = P.el?.classList.contains('max'), CAP = P.p.rows ?? 10
  const LIMIT = !P.el || max || P.expanded ? 500 : CAP, shown = rows.slice(0, LIMIT)
  const barCols = d.cols.map((c, i) => /cost|saved|spent|usd|result_chars|^chars$/.test(c) && d.rows.some(r => typeof r[i] === 'number') ? Math.max(...d.rows.map(r => +r[i] || 0)) : 0)
  const hide = new Set([...(opts.hide || []), ...(max ? [] : (P.p.hide || []).filter(c => d.cols.includes(c)))])
  const extraCols = max ? 0 : (P.p.hide || []).filter(c => d.cols.includes(c)).length
  const numCol = d.cols.map((c, i) => !TS_COL.test(c) && d.rows.some(r => typeof r[i] === 'number'))
  const f = P.el?.querySelector('.tfilter'); if (f) f.hidden = d.rows.length <= CAP && !P.filter
  const prev = el.querySelector('.tbl'), top = prev ? prev.scrollTop : 0
  el.innerHTML = `<div class="tbl"><table><thead><tr>${d.cols.map((c, i) => hide.has(c) ? '' : `<th data-i="${i}" class="${numCol[i] ? 'num' : ''}" title="${esc(c)}">${esc(opts.heads?.[c] ?? human(c))}${i === col ? `<span class="arrow">${asc ? '▲' : '▼'}</span>` : ''}</th>`).join('')}</tr></thead><tbody>${
    shown.map(r => `<tr class="${opts.rowClass ? opts.rowClass(r) : ''}">${r.map((v, i) => {
      const c = d.cols[i]
      if (hide.has(c)) return ''
      const custom = opts.cell && opts.cell(c, v, r)
      if (custom != null) return custom
      if (c === 'session_id' && v) return `<td><a data-sid="${esc(v)}" title="Open session">${esc(String(v).slice(0, 8))}</a></td>`
      if (typeof v === 'number' && numCol[i]) {
        const bar = barCols[i] && v > 0 ? `<span class="b" style="width:calc(${(100 * v / barCols[i]).toFixed(1)}% - 14px)"></span>` : ''
        return `<td class="num">${bar}<span class="v">${esc(fmtCell(c, v))}</span></td>`
      }
      if (typeof v === 'string' && /^(project|cwd|file|path)$/.test(c) && !long.has(c)) return `<td class="path" title="${esc(v)}">${esc(c === 'project' || c === 'cwd' ? projectLabel(v) : shortPath(v))}</td>`
      const tip = typeof v === 'string' && (v.length > 34 || (c === 'tool' && v.startsWith('mcp__'))) ? esc(v.slice(0, 2000)) : ''
      return long.has(c) ? `<td class="long"${tip ? ` title="${tip}"` : ''}><div class="clamp">${esc(fmtCell(c, v))}</div></td>`
        : `<td class="txt"${tip ? ` title="${tip}"` : ''}>${esc(fmtCell(c, v))}</td>`
    }).join('')}</tr>`).join('')}</tbody></table></div>${tableFoot(P, rows.length, d.rows.length, shown.length, CAP, max, extraCols)}`
  el.querySelector('.tbl').scrollTop = top
  el.querySelectorAll('th').forEach(th => th.onclick = () => {
    const i = +th.dataset.i; P.sort = { col: i, asc: P.sort.col === i ? !P.sort.asc : false }; drawTable(P)
  })
  el.querySelectorAll('a[data-sid]').forEach(a => a.onclick = () => openSession(a.dataset.sid))
  const more = el.querySelector('[data-more]')
  if (more) more.onclick = () => { P.expanded = !P.expanded; drawTable(P); if (!P.expanded) P.el.scrollIntoView({ block: 'nearest' }) }
  const exp = el.querySelector('[data-expand]')
  if (exp) exp.onclick = () => toggleMax(P)
}
/** Under a table: how many rows of how many, and the way to the rest. */
function tableFoot(P, matched, total, shown, cap, max, extraCols) {
  if (!P.el) return matched > shown ? `<div class="more">${shown} of ${big(matched)} rows · CSV has all</div>` : ''
  const parts = [P.filter ? `${big(matched)} of ${big(total)} rows match` : matched > shown ? `${shown} of ${big(matched)} rows` : '']
  if (shown > cap && !max && matched > shown) parts[0] += ' · CSV has all'
  if (extraCols) parts.push(`<a data-expand title="Expand to see every column">+${extraCols} column${extraCols > 1 ? 's' : ''}</a>`)
  const btn = !max && matched > cap ? `<button class="btn ghost sm" data-more>${P.expanded ? 'Show fewer' : `Show all ${big(matched)}`}</button>` : ''
  const text = parts.filter(Boolean).join(' · ')
  return text || btn ? `<div class="more"><span>${text}</span>${btn}</div>` : ''
}
function heatmap(el, d, p = {}) {
  const o = asObjs(d), m = {}, val = p.val || 'cost', fmt = p.fmt || usd
  let max = 0
  o.forEach(r => { m[r.weekday + '-' + r.hour] = r[val]; max = Math.max(max, r[val]) })
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], acc = css('--accent')
  let h = '<div class="heat"><div></div>' + [...Array(24).keys()].map(i => `<div>${i}</div>`).join('')
  for (const w of [1, 2, 3, 4, 5, 6, 0]) {
    h += `<div>${days[w]}</div>`
    for (let i = 0; i < 24; i++) {
      const v = m[w + '-' + i] || 0, a = max ? Math.sqrt(v / max) : 0
      h += `<div data-tip="${days[w]} ${i}:00–${i + 1}:00\n${fmt(v)}" style="background:${acc}${Math.round(a * 255).toString(16).padStart(2, '0')}"></div>`
    }
  }
  el.innerHTML = h + '</div>'
}
function csv(title, d) {
  const q = v => v == null ? '' : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v)
  const text = [d.cols.map(q).join(','), ...d.rows.map(r => r.map(q).join(','))].join('\n')
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }))
  a.download = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.csv'
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}

/** A sparkline you can read: hover shows each point's label and value (see the pointer handler under "tooltips"). */
function spark(vals, color, labels = [], fmt = 'big') {
  const v = vals.filter(x => x != null)
  if (v.length < 2) return ''
  const max = Math.max(...v), min = Math.min(...v), w = 120, h = 26, n = vals.length
  const ys = vals.map(x => x == null ? null : h - 2 - (x - min) / ((max - min) || 1) * (h - 4))
  const pts = vals.map((x, i) => [i * w / (n - 1), ys[i] ?? h - 2])
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('')
  return `<div class="sparkw" data-v="${esc(JSON.stringify(vals))}" data-y="${esc(JSON.stringify(ys.map(y => y == null ? null : +(100 * y / h).toFixed(1))))}" data-l="${esc(JSON.stringify(labels))}" data-f="${fmt}"><svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${line}L${w} ${h}L0 ${h}Z" fill="${color}" opacity=".1"/><path d="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><i class="sline"></i><i class="sdot" style="border-color:${color}"></i></div>`
}
function deltaHtml(cur, prev, sense, label) {
  if (label === 'none') return '<span class="delta"><span class="vs">no full previous period</span></span>'
  if (cur == null || prev == null || !state.compare) return '<span class="delta">&nbsp;</span>'
  if (!prev) return `<span class="delta">new <span class="vs">vs ${esc(label || 'previous')}</span></span>`
  return deltaSpan((cur - prev) / Math.abs(prev), sense, `vs ${esc(label || 'prev')}`)
}

    if (n > 1 && !pr && state.compare) Object.assign(p, { _none: true })

    const cards = [

async function insights(seq) {
  const el = $('#insights'); if (!el) return
  const [d, live] = await Promise.all([api('/api/batch', { q: 'kpis,kpi_daily,edit_vs_write,search_vs_lsp' }), api('/api/live')])
  if (seq !== state.seq) return
  const k = asObjs(d.kpis)[0] || {}, total = k.cost || 0, out = []
  const m = live.month
  if (m.mtd) out.push([m.projected && m.previous && m.projected > m.previous * 1.1 ? 'warn' : '', `<span class="k">Month to date ${usd(m.mtd)}</span> <span class="d">${m.projected ? `on pace for ${usd(m.projected)}` : `${m.elapsedPct}% of the month`}${m.previous ? ` · last month ${usd(m.previous)}` : ''}</span>`])
  const days = asObjs(d.kpi_daily).filter(r => r.cost != null)
  if (days.length >= 7) {
    const xs = days.map(r => r.cost), mean = xs.reduce((a, b) => a + b, 0) / xs.length, sd = Math.sqrt(xs.reduce((a, b) => a + (b - mean) ** 2, 0) / xs.length)
    const spikes = days.filter(r => r.cost > mean + 2 * sd && r.cost > mean * 1.5).sort((a, b) => b.cost - a.cost).slice(0, 3)
    if (spikes.length) out.push(['warn', `<span class="k">Spend spike${spikes.length > 1 ? 's' : ''}</span> <span class="d">${spikes.map(r => `${r.day} ${usd(r.cost)}`).join(', ')} · typical day ${usd(mean)}</span>`])
  }
  const ew = Object.fromEntries(asObjs(d.edit_vs_write).map(r => [r.tool, r]))
  if (ew.Write && ew.Edit && ew.Write.input_chars > ew.Edit.input_chars) out.push(['warn', `<span class="k">Whole-file rewrites dominate</span> <span class="d">Write ${big(ew.Write.input_chars)} chars vs Edit ${big(ew.Edit.input_chars)}</span>`])
  if (total) out.push([k.hit_pct > 90 ? 'good' : 'warn', `<span class="k">Cache hit ${pct(k.hit_pct)}</span> <span class="d">${pct(100 * (k.subagent_cost || 0) / total)} of spend in subagents</span>`])
  const lsp = asObjs(d.search_vs_lsp).reduce((a, r) => [a[0] + r.lsp, a[1] + r.text_search], [0, 0])
  if (lsp[1]) out.push([lsp[0] ? 'good' : 'warn', `<span class="k">LSP ${big(lsp[0])} calls</span> <span class="d">vs ${big(lsp[1])} grep/rg/find searches</span>`])
  out.push(['', `More levers, measured and verified: <a data-go="advisor">Advisor →</a>`])
  el.outerHTML = notes(out, 'Insights', 'selected period and filters').replace('<div class="insights">', '<div class="insights" id="insights">')
  el.querySelectorAll('[data-go]').forEach(a => a.onclick = () => go(a.dataset.go))
}

async function renderImpact(view) {
  view.innerHTML = about('Each mod leaves a random share of sessions untouched (the holdout); verdicts compare the two.',
    '<b>Verdict</b> compares cost per prompt in active vs holdout sessions, with a bootstrap 95% interval. A verdict appears only once the interval excludes zero.',
    '<b>Ledger</b> prices each mod’s own actions (text added to every request, classifier calls, keep-alive pings) against what it kept out of context. It is an upper bound on savings; the holdout comparison is the real answer.',
    'Uses the period and profile filters.') + '<div class="skel"></div>'
  teardown()
  $('#status').textContent = 'Loading…'
  const r = await api('/api/impact')
  view.querySelector('.skel').remove()
  const cls = { saving: 'good', costing: 'bad', collecting: '', unclear: 'warn' }
  view.insertAdjacentHTML('beforeend', notes([
    ...r.mods.map(m => [cls[m.verdict[0]], `<b>${esc(m.mod)}</b> ${esc(m.verdict[1])}${m.costs.length || m.savings.length ? ` <span class="muted">· ledger net ${usd(m.net)}</span>` : ''}`]),
    ['good', `<b>usage-analytics</b> ${esc(r.observer.note)}`],
  ], 'Verdicts', 'active vs holdout sessions'))
  for (const m of r.mods) {
    view.insertAdjacentHTML('beforeend', sec(esc(m.mod), `holdout ${m.holdoutShare == null ? '?' : (100 * m.holdoutShare).toFixed(0) + '%'} of sessions`))
    if (m.warnings.length) view.insertAdjacentHTML('beforeend', notes(m.warnings.map(w => ['warn', esc(w)])))
    const grid = gridIn(view)
    const add = (p, d) => fill(makePanel(p, grid), d)
    const fx = m.effects.map(e => [e.metric, e.on, e.holdout, chg(e.diff), ciText(e.lo, e.hi)])
    add({ title: 'Active vs holdout', note: `${m.arms.on?.sessions || 0} active · ${m.arms.holdout?.sessions || 0} holdout sessions`, kind: 'table' }, { cols: ['metric', 'active', 'holdout', 'change', '95% interval'], rows: fx.map(([k, a, b, d, ci]) => [k, k.includes('cost') ? usd(a) : big(a), k.includes('cost') ? usd(b) : big(b), d, ci]) })
    add({ title: 'Ledger', note: 'saved (+) vs own cost (−), active sessions', kind: 'table' }, { cols: ['', 'item', 'usd', 'times'], rows: [...m.savings.map(x => ['+', ...x]), ...m.costs.map(x => ['−', ...x])] })
    if (m.compliance.length) add({ title: 'Nudges followed', info: 'Followed in active sessions vs would-have-been nudges in the holdout.', kind: 'table' }, { cols: ['nudge', 'arm', 'followed', 'total', 'followed_pct'], rows: m.compliance })
    add({ title: 'Actions', kind: 'table' }, { cols: ['kind', 'arm', 'n'], rows: m.actions })
  }
  view.insertAdjacentHTML('beforeend', sec('All mods'))
  const grid = gridIn(view)
  const agg = {}, daily = { cols: ['day', 'mod', 'n'], rows: [] }
  asObjs(r.daily).forEach(o => agg[o.day + '|' + o.mod] = (agg[o.day + '|' + o.mod] || 0) + o.n)
  Object.entries(agg).forEach(([k, n]) => daily.rows.push([...k.split('|'), n]))
  fill(makePanel({ title: 'Mod actions per day', kind: 'stacked', x: 'day', series: 'mod', y: 'n', wide: true }, grid), daily)
  status()
}

const VERDICT = {
  improved: ['good', 'helped'], tradeoff: ['warn', 'helped, with a cost'], regressed: ['bad', 'made it worse'],
  no_effect: ['', 'no measurable effect'], changed: ['', 'changed'], collecting: ['', 'measuring…'],
}
function advValue(m, v) {
  if (v == null) return '–'
  return m.unit === 'usd' ? '$' + v.toFixed(v < 10 ? 3 : 2) : m.unit === 'pct' ? v.toFixed(1) + '%' : m.unit === 'sec' ? v.toFixed(1) + 's' : v >= 100 ? big(Math.round(v)) : v.toFixed(2)
}

  const OPEN = ['proposed', 'accepted', 'trial', 'applied']

    const srcs = (r.sources || []).map(x => typeof x === 'string' ? { url: x } : x)
    const change = r.action || r.instruction ? `<div class="change">${r.instruction
      ? `<span class="eyebrow" title="Added to the system prompt in the trial's sessions">Instruction for the trial</span>${esc(r.instruction)}${r.action ? `<span class="eyebrow" style="margin-top:6px">Or change</span>${esc(r.action)}` : ''}`
      : `<span class="eyebrow">Change</span>${esc(r.action)}`}</div>` : ''
    const why = [
      field('Hypothesis', r.hypothesis ? esc(r.hypothesis) : ''),
      field('Expected', r.expected ? esc(r.expected) : ''),
      field('Against', r.counter ? esc(r.counter) : ''),
      field('Risk', r.risk ? esc(r.risk) : ''),
      field('Note', r.note ? esc(r.note) : ''),
      ev ? '' : evHtml,
      field('Sources', srcs.length ? `<div class="rsources">${srcs.map(x => `<span class="src ${x.kind === 'primary' ? 'primary' : ''}" title="${x.kind === 'primary' ? 'Primary source' : 'Secondary source'}${x.checked ? ` · checked ${esc(x.checked)}` : ''}">${link(x.url, x.title)}${x.kind === 'primary' ? '<em>primary</em>' : ''}</span>`).join('')}</div>` : ''),
      checks.length ? checks.map(([k, val, t]) => field(`<span title="${esc(t)}">${k}</span>`, val)).join('') : '',
      (v.notes || []).length ? field('Result notes', v.notes.map(esc).join('<br>')) : '',
    ].join('')
    const whyCount = [r.hypothesis, r.expected, r.counter, r.risk, r.note, srcs.length, checks.length, (v.notes || []).length].filter(Boolean).length
    return `<article class="rec st-${esc(r.status)}">
      <header class="rec-head"><div class="rec-tags">${tag(STATUS[r.status] || esc(r.status), r.status === 'trial' ? 'accent' : 'plain')}${r.grade ? tag(`Grade ${esc(r.grade)}`, gcls, `Evidence grade ${r.grade}: ${gword}`) : ''}</div><code class="rec-id">${esc(r.id)}</code></header>
      <h4>${esc(r.title)}</h4>
      <div class="rec-sub"><span>${esc(r.goal)}</span><span>${esc(labelOf[r.metric] || r.metric)}</span>${r.effort ? `<span>effort ${esc(r.effort)}</span>` : ''}${scope}</div>
      ${stats.length ? `<div class="kpis compact">${stats.join('')}</div>` : ''}
      ${result}
      ${change}
      ${(r.warnings || []).length ? `<div class="callout warn"><b>Check before relying on it:</b> ${r.warnings.map(esc).join(' · ')}</div>` : ''}
      ${whyCount || ev || segs ? `<details class="rdisc"><summary>Why &amp; evidence</summary>${why ? `<dl class="rfields">${why}</dl>` : ''}${ev ? evHtml : ''}${segs}</details>` : ''}
      <footer class="rec-foot"><div class="rec-actions">${buttons}</div><div class="rec-copy">${copies}</div></footer>
    </article>`
  }
  view.insertAdjacentHTML('beforeend', live.length ? `<div class="recs">${live.map(card).join('')}</div>`
    : notes([['', 'No open recommendations. Run <code>/analytics advise</code> in Claude Code, or <code>/analytics advise bg</code> to research in the background.']]))

  if (d.detectors.length) {
    sect('Findings', 'from your data in this period, no model involved')
    const sev = { high: 'bad', medium: 'warn', low: '' }
    view.insertAdjacentHTML('beforeend', notes(d.detectors.map(x => [sev[x.severity] || '', `<span class="k">${esc(x.title)}</span> <span class="d">${esc(x.detail)}</span>`])))
  }

  sect('History'); const grid = gridIn(view)
  const add = (p, data) => fill(makePanel(p, grid), data)
  const tbl = (rows, cols) => ({ cols, rows: rows.map(r => cols.map(c => r[c] ?? '')) })
  if (done.length) add({ title: 'Closed recommendations', kind: 'table' }, tbl(done.map(r => ({ ...r, verdict: r.verdict ? (VERDICT[r.verdict] || [, r.verdict])[1] : '' })), ['id', 'status', 'title', 'verdict', 'status_at']))
  if (tr.length) add({ title: 'Track record', note: 'what kind of advice works here', info: 'success: helped among measured verdicts, Laplace-smoothed ((helped+1)/(measured+2))\nrandomized: verdicts from A/B trials', kind: 'table', wide: true }, { cols: ['bucket', 'proposed', 'applied', 'dismissed', 'improved', 'tradeoff', 'regressed', 'no_effect', 'randomized', 'success'], rows: Object.entries(d.trackRecord).map(([k, v]) => [k, v.proposed, v.applied, v.dismissed, v.improved, v.tradeoff, v.regressed, v.no_effect, v.randomized ?? 0, v.successRate == null ? '' : (100 * v.successRate).toFixed(0) + '%']) })
  const seg = Array.isArray(d.segments) ? d.segments : d.segments?.project || []
  if (seg.length) {
    const sc = Object.keys(seg[0]).filter(k => !['project', 'segment'].includes(k))
    const metricOf = Object.fromEntries(d.metrics.map(m => [m.key || m.metric, m]))
    fill(makePanel({ title: 'Metrics by project', info: 'The advisor scopes advice to the projects where a lever lives; what helps one project can hurt another.', kind: 'table', wide: true, hide: ['whole_file_reads', 'requests_per_prompt', 'non_english_prompts'] }, grid),
      { cols: ['project', 'spend_share', ...sc.filter(k => k !== 'spendShare')], rows: seg.map(r => [r.project ?? r.segment, r.spendShare == null ? null : 100 * r.spendShare, ...sc.filter(k => k !== 'spendShare').map(k => r[k] ?? null)]) },
      { cell: (c, v) => typeof v === 'number' && (metricOf[c] || c === 'spend_share') ? `<td class="num">${c === 'spend_share' ? Math.round(v) + '%' : advValue(metricOf[c], v)}</td>` : null })
  }
  add({ title: 'Setting changes', info: 'Read from session starts. The advisor uses these to tell your own changes from its advice.', kind: 'table' }, tbl(d.changes, ['ts', 'profile', 'what', 'change']))
  add({ title: 'Research runs', kind: 'table', wide: true }, tbl(d.runs, ['started', 'trigger_', 'model', 'status', 'recs', 'summary']))
  if (d.notes.length) add({ title: 'Research notes', info: 'stale: checked more than 90 days ago; the next run re-checks it', kind: 'table', wide: true }, tbl(d.notes.map(x => ({ ...x, stale: x.stale ? 'stale' : '' })), ['ts', 'topic', 'finding', 'source', 'kind', 'published', 'checked', 'stale']))

  view.querySelectorAll('[data-rec]').forEach(b => b.onclick = async () => {
    let note = ''
    if (b.dataset.st === 'dismissed' || b.dataset.st === 'reverted') note = prompt(b.dataset.st === 'dismissed' ? 'Why dismiss it? (the advisor learns from this)' : 'What happened?') ?? ''
    b.disabled = true
    const r = await fetch('/api/advisor/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: b.dataset.rec, status: b.dataset.st, note }) })
    const j = await r.json()
    if (!r.ok) { toast(j.error || 'failed'); b.disabled = false; return }
    toast(b.dataset.st === 'trial' ? `${b.dataset.rec}: A/B trial on, from the next new session` : `${b.dataset.rec}: ${j.rec?.status || b.dataset.st}`)
    renderAdvisor(view)
  })
  view.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Copied: ' + b.dataset.copy), () => toast(b.dataset.copy)))
  status()
}

async function renderRecurring(view) {
  view.innerHTML = about('Prompts you typed three or more times on at least two days, grouped by meaning, scored by how automatable they look.',
    'Grouping uses no model: paths, numbers, branch names and quoted text are ignored, so “fix CI on feat/a” and “why did CI fail on fix/b” are one ask. The score weighs how often, how steadily, how stable the wording, and what it costs.',
    'Run <code>/analytics recurring classify</code> in Claude Code to have a model name each ask and draft a skill, hook, slash command or CLAUDE.md rule. Mark it automated and the table shows whether it stopped.',
    'Prompts are redacted before they are stored and again before any are shown to a model.') + '<div class="skel"></div>'
  teardown()
  $('#status').textContent = 'Loading…'
  const d = await api('/api/recurring')
  view.querySelector('.skel')?.remove()
  const color = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#888'
  const stat = (label, value, sub) => tile({ label, value, sub: `<span class="delta"><span class="vs">${sub || '&nbsp;'}</span></span>` })
  const live = d.clusters.filter(c => c.status !== 'dismissed')
  const auto = d.clusters.filter(c => c.status === 'automated')
  const saved = d.clusters.reduce((a, c) => a + (c.status === 'new' && c.label?.estUsdMonth || 0), 0)
  view.insertAdjacentHTML('beforeend', `<div class="kpis auto">
    ${stat('Recurring asks', big(d.clusterCount), `${big(d.recurring)} prompts`)}
    ${stat('Share of prompts', Math.round(100 * d.recurringShare) + '%', `${big(d.prompts - d.recurring)} one-off`)}
    ${stat('Per month', big(Math.round(d.perMonth)), 'repeat prompts')}
    ${stat('Their cost', usd(d.costPerMonth), 'per month, est.')}
    ${stat('Automated', big(auto.length), saved ? `${usd(saved)}/month still open` : 'marked by you')}
  </div>`)
  if (!d.clusters.length) {
    view.insertAdjacentHTML('beforeend', notes([['', `No ask came up ${d.params.minCount}+ times on ${d.params.minDays}+ days in this period. Try a longer period.`]]))
    status(); return
  }
  const STATUS = { new: 'New', automated: 'Automated', dismissed: 'Dismissed' }
  const EFF = { stopped: ['good', 'stopped'], dropped: ['good', 'dropped'], unchanged: ['bad', 'unchanged'], 'too early': ['', 'too early'], 'no baseline': ['', 'no baseline'] }
  const cols = [['title', 'Ask', 0], ['count', 'Times', 1], ['days', 'Days', 1], ['perMonth', '/month', 1], ['costPerMonth', '$/month', 1], ['score', 'Score', 1], ['last', 'Last', 0], ['st', 'Status', 0]]
  const view_ = { key: 'score', asc: false, show: 'open', all: false }, CAP = 10
  const title = c => c.label?.title || c.exemplar
  const val = (c, k) => k === 'title' ? title(c).toLowerCase() : k === 'last' ? c.lastSeen : k === 'st' ? c.status : c[k]
  const shows = { open: c => c.status !== 'dismissed', all: () => true, automated: c => c.status === 'automated', dismissed: c => c.status === 'dismissed' }
  const seg = `<div class="seg sm">${Object.keys(shows).map(k => `<button data-show="${k}">${k[0].toUpperCase() + k.slice(1)}<span class="n">${d.clusters.filter(shows[k]).length}</span></button>`).join('')}</div>`
  view.insertAdjacentHTML('beforeend', `${sec('Asks', 'click a row for details', seg)}
    <div class="rc-wrap"><table class="rc"><thead></thead><tbody></tbody></table><div class="more rc-foot"></div></div>`)
  const thead = view.querySelector('table.rc thead'), tbody = view.querySelector('table.rc tbody'), foot = view.querySelector('.rc-foot')
  const detail = c => {
    const L = c.label, A = L?.automation, e = c.effect
    const btn = (st, label, kind = '') => `<button class="btn sm ${kind}" data-id="${esc(c.id)}" data-st="${st}">${label}</button>`
    return `<tr class="rc-detail-row" data-for="${esc(c.id)}" hidden><td colspan="${cols.length}" style="padding:0"><div class="rc-detail">
      <div><h5>Samples</h5><ul>${c.samples.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <h5 style="margin-top:10px">Per week</h5>${spark(c.weekly, color, d.weeks.map(w => 'week of ' + w), 'num') || '<small>too short for a trend</small>'}
        <small>${esc(c.reason)}. In ${c.sessions} sessions${c.projects.length ? ': ' + c.projects.slice(0, 3).map(p => esc(String(p[0]).split('/').filter(Boolean).pop() || p[0]) + ' ×' + p[1]).join(', ') : ''}.</small>
        ${e ? `<p style="margin:8px 0 0">${tag((EFF[e.verdict] || ['', e.verdict])[1], (EFF[e.verdict] || [''])[0] || 'plain')} ${e.beforePerWeek}/week before ${esc(e.at)}, ${e.afterPerWeek}/week since (${e.afterDays} days)</p>` : ''}</div>
      <div>${L ? `<h5>${esc(L.category || '')} · ${esc(A?.kind || 'none')}${L.estPromptsMonth ? ` · saves ~${big(Math.round(L.estPromptsMonth))} prompts, ~${usd(L.estUsdMonth)}/month` : ''}</h5><p style="margin:0 0 8px">${esc(L.rationale || '')}</p>
        ${A?.draft ? `<h5>Draft</h5><pre>${esc(A.draft)}</pre>` : ''}`
        : `<h5>Not labelled yet</h5><p style="margin:0">Run <code>/analytics recurring classify</code> in Claude Code to get a title, a category and a draft for this ask.</p>`}</div>
      <div class="rc-actions">${A?.draft ? `<button class="btn sm primary" data-copy-draft="${esc(c.id)}">Copy draft</button>` : ''}${c.status === 'automated' ? btn('new', 'Reopen', 'ghost') : btn('automated', 'Mark automated', 'primary')}${c.status === 'dismissed' ? btn('new', 'Reopen', 'ghost') : btn('dismissed', 'Dismiss', 'ghost')}
        <button class="btn sm ghost" data-copy="/analytics recurring show ${esc(c.id)}">Copy show</button></div>
    </div></td></tr>`
  }
  const draw = () => {
    thead.innerHTML = '<tr>' + cols.map(([k, l, n]) => `<th class="${n ? 'num' : ''}" data-k="${k}">${l}${view_.key === k ? `<span class="arrow">${view_.asc ? '▲' : '▼'}</span>` : ''}</th>`).join('') + '</tr>'
    const all = d.clusters.filter(shows[view_.show])
      .sort((a, b) => { const x = val(a, view_.key), y = val(b, view_.key); return (x < y ? -1 : x > y ? 1 : 0) * (view_.asc ? 1 : -1) })
    const rows = view_.all ? all : all.slice(0, CAP)
    foot.innerHTML = all.length > CAP ? `<span>${rows.length} of ${all.length} asks</span><button class="btn ghost sm" data-all>${view_.all ? 'Show fewer' : `Show all ${all.length}`}</button>` : ''
    tbody.innerHTML = rows.map(c => `<tr class="rc-row" data-id="${esc(c.id)}"><td class="ask"><span class="t">${esc(title(c))}</span><small>${c.label ? esc(c.label.category || '') + (c.label.automation?.kind && c.label.automation.kind !== 'none' ? ' · ' + esc(c.label.automation.kind.replace(/_/g, ' ')) : '') : esc(c.reason)}</small></td>
      <td class="num">${big(c.count)}</td><td class="num">${c.days}</td><td class="num">${c.perMonth}</td><td class="num">${usd(c.costPerMonth)}</td><td class="num">${Math.round(c.score)}</td><td>${esc(c.lastSeen)}</td>
      <td>${tag(STATUS[c.status] || esc(c.status), c.status === 'automated' ? 'good' : 'plain')}</td></tr>${detail(c)}`).join('') || `<tr><td colspan="${cols.length}"><small>Nothing here.</small></td></tr>`
    view.querySelectorAll('[data-show]').forEach(b => b.classList.toggle('on', b.dataset.show === view_.show))
  }
  view.onclick = async ev => {
    const t = ev.target
    if (t.closest('th[data-k]')) { const k = t.closest('th').dataset.k; view_.asc = view_.key === k ? !view_.asc : k === 'title'; view_.key = k; draw(); return }
    const sh = t.closest('[data-show]'); if (sh) { view_.show = sh.dataset.show; view_.all = false; draw(); return }
    if (t.closest('[data-all]')) { view_.all = !view_.all; draw(); if (!view_.all) view.querySelector('.rc-wrap').scrollIntoView({ block: 'nearest' }); return }
    if (t.dataset.copy) return navigator.clipboard.writeText(t.dataset.copy).then(() => toast('Copied: ' + t.dataset.copy), () => toast(t.dataset.copy))
    if (t.dataset.copyDraft) {
      const c = d.clusters.find(x => x.id === t.dataset.copyDraft)
      return navigator.clipboard.writeText(c?.label?.automation?.draft || '').then(() => toast('Draft copied'), () => toast('Copy failed'))
    }
    if (t.dataset.st) {
      t.disabled = true
      const r = await fetch('/api/recurring/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: t.dataset.id, status: t.dataset.st, days: +state.days || 0 }) })
      const j = await r.json()
      if (!r.ok) { toast(j.error || 'failed'); t.disabled = false; return }
      toast(`${t.dataset.id}: ${j.status}`)
      renderRecurring(view)
      return
    }
    const row = t.closest('tr.rc-row')
    if (row) { const det = tbody.querySelector(`tr.rc-detail-row[data-for="${row.dataset.id}"]`); if (det) { det.hidden = !det.hidden; row.classList.toggle('open', !det.hidden) } }
  }
  draw()
  if (d.retired?.length) view.insertAdjacentHTML('beforeend', notes(d.retired.map(x => ['good', `<span class="k">${esc(x.title || x.id)}</span> <span class="d">automated ${esc(String(x.statusAt || '').slice(0, 10))}, no longer recurring</span>`]), 'Automated away'))
  view.insertAdjacentHTML('beforeend', sec('Over time')); const grid = gridIn(view)
  fill(makePanel({ title: 'Recurring vs one-off prompts per week', kind: 'stacked', x: 'week', series: 'kind', y: 'prompts', wide: true,
    info: 'Recurring prompts are the ones in the asks above; a falling recurring share means asks are being automated away.' }, grid),
    { cols: ['week', 'kind', 'prompts'], rows: d.weeks.flatMap((w, i) => [[w, 'recurring', d.weeklyRecurring[i]], [w, 'one-off', Math.max(0, d.weeklyAll[i] - d.weeklyRecurring[i])]]) })
  status()
}
