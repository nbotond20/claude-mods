# Loki for claude-observability: local only, no usage reporting, old events accepted (backfill), retention.
auth_enabled: false

analytics:
  reporting_enabled: false

server:
  http_listen_port: 3100
  # a collector batch of backfilled events can pass the 4MB default between distributor and ingester
  grpc_server_max_recv_msg_size: 67108864
  grpc_server_max_send_msg_size: 67108864

ingester_client:
  grpc_client_config:
    max_send_msg_size: 67108864
    max_recv_msg_size: 67108864

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  reject_old_samples: false
  max_line_size: 0
  retention_period: ${LOKI_RETENTION:-2160h}
  max_query_length: 0
  max_query_series: 5000
  # a transcript backfill sends months of events in minutes
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  per_stream_rate_limit: 64MB
  per_stream_rate_limit_burst: 128MB
  # each backfilled session is its own short-lived stream (old entries only go into a fresh stream)
  max_global_streams_per_user: 100000
  volume_enabled: true
  discover_service_name: [service_name]
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [claude.profile, service.name, claude.backfill]
    log_attributes:
      - action: index_label
        attributes: [event.name]

compactor:
  working_directory: /data/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  delete_request_cancel_period: 10m

pattern_ingester:
  enabled: true
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false
